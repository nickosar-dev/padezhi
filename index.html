<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18202D">
<title>Падежи</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202D; --muted:#5A6676; --line:#D6DBE3;
  --focus:#2B45C4; --bad:#B3261E; --good:#1B7A4A;
  --c-gen:#4650C4; --c-acc:#0C8272; --c-dat:#9A6200; --c-instr:#B0276A;
  --c-loc:#4B7A17; --c-voc:#7A47B5; --c-verb:#3F6C86; --c-none:#5A6676;
  --serif:Literata,Georgia,"Noto Serif","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151C; --surface:#1A212C; --ink:#E7EBF2; --muted:#9AA6B6; --line:#2C3544;
    --focus:#9DB0FF; --bad:#FF8A80; --good:#6FD4A0;
    --c-gen:#9AA4FF; --c-acc:#4FD0BC; --c-dat:#E6B24E; --c-instr:#F28BB8;
    --c-loc:#A5D26A; --c-voc:#C7A3F2; --c-verb:#7EB7D6; --c-none:#9AA6B6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151C; --surface:#1A212C; --ink:#E7EBF2; --muted:#9AA6B6; --line:#2C3544;
  --focus:#9DB0FF; --bad:#FF8A80; --good:#6FD4A0;
  --c-gen:#9AA4FF; --c-acc:#4FD0BC; --c-dat:#E6B24E; --c-instr:#F28BB8;
  --c-loc:#A5D26A; --c-voc:#C7A3F2; --c-verb:#7EB7D6; --c-none:#9AA6B6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.app{max-width:680px;margin:0 auto;padding:18px 16px 72px}
h1{font:600 24px/1.2 var(--serif);margin:0 0 10px}
h2{font:600 19px/1.3 var(--serif);margin:30px 0 10px}
h3{font:600 16px/1.3 system-ui,sans-serif;margin:24px 0 8px}
p{margin:0 0 10px}
.hint,.muted{color:var(--muted)}
.hint{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:8px 0;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

.banner{margin:16px 0 0;padding:10px 14px;background:var(--surface);border-left:3px solid var(--good);font-size:15px}
.banner.warn{border-left-color:var(--bad)}
.banner .btn{margin-top:8px}
.counts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:18px 0 6px;font-size:14px;color:var(--muted)}
.counts b{font-weight:600;color:var(--ink);margin-left:2px}
.counts .on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

.q{margin:26px 0 8px;padding:2px 0 2px 16px;border-left:4px solid var(--cc,var(--c-none))}
.src{font-size:13px;color:var(--muted);margin-bottom:4px}
.sent{font:400 clamp(22px,5.6vw,30px)/1.5 var(--serif);overflow-wrap:anywhere}
.sent.small{font-size:clamp(19px,4.8vw,24px)}
.sent i{color:var(--muted)}
.sent b{font-weight:600}
.tr{margin-top:8px;font:italic 400 17px/1.45 var(--serif);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;cursor:pointer}
.pill:hover{color:var(--ink)}

.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 0;font-size:14px}
.dprog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:12px 0 0}
.dprog i{display:block;height:100%;background:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.btn.dbtn{text-align:left;padding:10px 12px}
.dbtn b{display:block;font-weight:600}
.dbtn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.verdict{margin:16px 0 0;font-size:16px}
.verdict.yes{color:var(--good)}
.verdict.no{color:var(--bad)}
.verdict b{color:var(--ink)}
.mist{list-style:none;padding:0;margin:10px 0}
.mist li{padding:8px 0;border-top:1px solid var(--line);font:400 17px/1.4 var(--serif)}
.mist small{display:block;font:13px/1.4 system-ui,sans-serif;color:var(--muted)}
.blank-input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--cc,var(--c-none));
  border-radius:0;padding:0 2px;margin:0 1px;text-align:center;max-width:100%;min-width:3ch}
.blank-input:focus{outline:none;background:color-mix(in srgb,var(--cc,var(--c-none)) 14%,transparent)}
.blank-input::placeholder{color:var(--muted);opacity:.75;font-style:italic;font-size:.8em}
.gap{border-bottom:2px solid var(--cc,var(--c-none));padding:0 6px;color:var(--muted);font-style:italic;font-size:.85em}
.ans{color:var(--cc,var(--c-none));font-weight:600}
.ans.accent{text-decoration:underline dotted;text-underline-offset:4px}
.sent del,.tcell del{color:var(--bad);opacity:.85}
.extra{margin:18px 0 6px;padding:10px 14px;background:var(--surface);border-left:3px solid var(--cc,var(--c-none));font-size:15px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.reflinks{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 0 0;font-size:14px;color:var(--muted)}

.opts{display:grid;gap:8px;margin:20px 0 6px}
.btn.opt{display:flex;gap:12px;align-items:baseline;text-align:left;font:400 18px/1.35 var(--serif);padding:12px 14px}
.opt .num{font:500 13px/1 system-ui,sans-serif;color:var(--muted)}
.opt.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.5}

.tbl{margin-top:14px}
.trow{padding:8px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.tlab{font-size:13px;color:var(--muted)}
.tlab b{color:var(--ink);font-weight:600}
.tcell{font:400 22px/1.4 var(--serif);overflow-wrap:anywhere}
.tcell .pre,.tcell .given{color:var(--muted)}
.tcell .blank-input{text-align:left}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;transition:background .12s}
.btn:hover{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn.key{padding:5px 11px;font:500 18px/1.2 var(--serif)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 8px}
.grades .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.grades .btn small{color:var(--muted);font-size:12px}
.grades .btn.sug{outline:2px solid var(--cc,var(--ink));outline-offset:1px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.undo{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px}
.done{margin:34px 0}
.done p{font-size:17px}
.empty{margin:34px 0;color:var(--muted)}

.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0 8px}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.fc{display:flex;align-items:flex-end;gap:8px;height:110px;margin:8px 0 0}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted)}
.fc i{display:block;width:100%;background:var(--ink);opacity:.8;border-radius:3px 3px 0 0;min-height:2px}
.fc span{margin-top:4px}
.fc em{font-style:normal;color:var(--ink);font-size:12px;margin-bottom:2px}
.acc{margin:12px 0}
.acc .top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.acc .top span:last-child{color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cc,var(--c-none))}

.pack{padding:12px 0;border-top:1px solid var(--line)}
.pack .head{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pack .head input{width:20px;height:20px;margin:2px 0 0;flex:none}
.pack small{display:block;color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:6px 0 0 32px}
.notes{list-style:none;margin:10px 0 0;padding:0}
.notes li{padding:10px 0;border-top:1px solid var(--line)}
.notes li.off{opacity:.5}
.notes .nt{font:400 15px/1.45 var(--serif);overflow-wrap:anywhere}
.notes .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
textarea,input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.row>span{flex:1}
.row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.row input,.row select{width:130px;flex:none}
.row input[type=checkbox]{width:20px;height:20px}
.lvls{display:flex;gap:14px;flex:none}
.lvls label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lvls input{width:20px;height:20px;margin:0}
.flash{color:var(--good);font-size:14px;min-height:1.4em;margin-top:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.ref{font-size:15px}
.ref h2{margin-top:34px}
.ref section,.ref tr{scroll-margin-top:70px}
.backbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0;margin:8px 0 -8px;border-bottom:1px solid var(--line)}
.ref .toc ol{margin:8px 0 0;padding-left:22px}
.ref .toc li{margin:3px 0}
.ref a{color:inherit;text-underline-offset:3px}
.ref ul{padding-left:20px;margin:8px 0}
.ref li{margin:4px 0}
.tw{overflow-x:auto;margin:10px 0}
.ref table{border-collapse:collapse;width:100%;font-size:14px}
.ref th,.ref td{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:top}
.ref th{color:var(--muted);font-weight:500}
.ref th small{font-weight:400}
.ref .hl,.ref .hl td{background:color-mix(in srgb,var(--focus) 16%,transparent);transition:background .4s}
@media (min-width:560px){.ref .toc ol{columns:2;column-gap:28px}}
@media (max-width:420px){.grades{grid-template-columns:repeat(2,1fr)}.tabs{gap:14px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <main id="view"></main>
</div>

];

var DRILL_LEN=10;
var TNAME={pres:'Настоящее время',past:'Прошедшее время',futi:'Будущее время, несов. вид',futp:'Будущее время, сов. вид',imper:'Повелительное наклонение',cond:'Условное наклонение'};

        {p:'on',r:'он',g:'m',i:2},{p:'ona',r:'она',g:'f',i:2},{p:'my, мужчины',r:'мы',g:'mp',i:0},{p:'my, женщины',r:'мы',g:'fp',i:0},

   S: прогресс (хранится на устройстве, попадает в резервную копию).
   C: последняя скачанная колода с сервера (packs/index.json + packs/*).
   NOTES: активные заметки (включённые пакеты и уровни + свои, без скрытых). */
var S=null, C={packs:[],checked:0}, NOTES={}, NOTE_LIST=[];
var cur=null, tab='study', undoRec=null, lastBlank=null, confirmKey=null;
var notice='', saveFailed=false, installEvt=null;
var net={busy:false,status:''};
var REF=null, LEX=null, refBack=false, refTarget=null, refShow=false, drill=null;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sanitize(html){return esc(html).replace(/&lt;(br|\/i|\/b|i|b)\s*\/?&gt;/gi,'<$1>');}
function dayIdx(ts){var d=new Date(ts-4*3600*1000);return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY);}
function todayIdx(){return dayIdx(Date.now());}
function fmtMin(m){return m<60?m+' мин':(m<1440?Math.round(m/60)+' ч':Math.round(m/1440)+' д');}
function fmtDays(d){return d<14?d+' д':(d<60?Math.round(d/7)+' нед':Math.round(d/30)+' мес');}
function fmtWhen(ts){
  var d=new Date(ts), t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return dayIdx(ts)===todayIdx()?'сегодня в '+t:d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' в '+t;
}
function plain(text){return String(text).replace(/<[^>]*>/g,' ').replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,'[$1]').replace(/\s+/g,' ').trim();}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* id заметки = хеш её ключа: одинаковая заметка в любом пакете даёт ту же карточку,
   а исправленный текст считается новой заметкой с чистым прогрессом.
   Ключ пропуска собирается как в старом формате Anki (текст<br><i>перевод</i>),
   поэтому прогресс по карточкам из .txt сохраняется после перехода на .json. */
function cyrb53(str){
  var h1=0xdeadbeef, h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){ var ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function keyOf(it){
  if(it.key) return it.key;
  if(it.type==='cloze') return it.text+(it.tr?'<br><i>'+it.tr+'</i>':'');
  if(it.type==='choice') return 'choice|'+it.q+'|'+it.answer;
  return 'table|'+it.q+'|'+it.rows.map(function(r){return r[1];}).join('|');
}
var idCache={};
function noteId(it){
  var s=keyOf(it);
  if(idCache[s]) return idCache[s];
  return (idCache[s]='n'+cyrb53(String(s).normalize('NFC').replace(/\s+/g,' ').trim()).toString(36));
}

/* ---------- items ---------- */
function clozeNums(text){
  var re=/\{\{c(\d+)::/g, set={}, m, out=[];
  while((m=re.exec(text))){ if(!set[m[1]]){set[m[1]]=1;out.push(+m[1]);} }
  return out.sort(function(a,b){return a-b;});
}
function cardNums(it){ return it.type==='cloze'?clozeNums(it.text):[1]; }
function topicsOf(it,k){ return (it.per&&it.per[k])||it.topics||[]; }
function allTopics(it){
  var o={}; (it.topics||[]).forEach(function(t){o[t]=1;});
  if(it.per) Object.keys(it.per).forEach(function(k){ it.per[k].forEach(function(t){o[t]=1;}); });
  return Object.keys(o);
}
function colorKey(tps){
  for(var i=0;i<tps.length;i++) if(COLOR_CASES.indexOf(tps[i])>=0) return tps[i];
  for(var j=0;j<tps.length;j++) if(TOPICS[tps[j]]&&TOPICS[tps[j]].g==='verb') return 'verb';
  return 'none';
}
function topicName(k){ var T=TOPICS[k]; return T.pl?T.ru+' ('+T.pl+')':T.ru; }
function normItem(r){
  if(!r||typeof r!=='object') return null;
  var lv=+r.level;
  var it={type:r.type||'cloze',level:(lv===1||lv===2||lv===3)?lv:2,tr:r.tr||'',note:r.note||'',
          topics:(r.topics||[]).filter(function(t){return TOPICS[t];}),tags:r.tags||[]};
  if(r.key) it.key=r.key;
  if(r.per) it.per=r.per;
  if(it.type==='cloze'){ if(!r.text||!/\{\{c\d+::/.test(r.text)) return null; it.text=r.text; }
  else if(it.type==='choice'){ if(!r.q||!r.options||r.options.indexOf(r.answer)<0) return null; it.q=r.q; it.options=r.options.slice(); it.answer=r.answer; }
  else if(it.type==='table'){ if(!r.q||!r.rows||!r.rows.length) return null; it.q=r.q; it.rows=r.rows.map(function(x){return [String(x[0]),String(x[1]),!!x[2]];}); }
  else return null;
  return it;
}
/* строка старого формата Anki: текст<br><i>перевод</i> | пояснение | теги */
function legacyItem(raw,extra,tags){
  raw=String(raw).trim();
  var it={type:'cloze',level:2,key:raw,text:raw,tr:'',note:extra||'',topics:[],tags:[]};
  var m=raw.match(/^([\s\S]*?)<br>\s*<i>([\s\S]*?)<\/i>\s*$/i);
  if(m&&/\{\{c\d+::/.test(m[1])){ it.text=m[1].trim(); it.tr=m[2].trim(); }
  var tg=String(tags||'').split(/\s+/).filter(Boolean);
  var cases=tg.filter(function(t){return COLOR_CASES.indexOf(t)>=0;});
  var rest=tg.filter(function(t){return TOPICS[t]&&COLOR_CASES.indexOf(t)<0;});
  it.topics=cases.slice(0,1).concat(rest);
  if(cases.length>1){ it.per={}; clozeNums(it.text).forEach(function(k){ it.per[k]=[cases[Math.min(k-1,cases.length-1)]].concat(rest); }); }
  it.tags=tg.filter(function(t){return !TOPICS[t];});
  return it;
}
function itemPlain(it){ return plain(it.type==='cloze'?it.text:it.q); }

/* ---------- cloze ---------- */
function extractAnswers(text,k){
  var re=/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, m, out=[];
  while((m=re.exec(text))){ if(+m[1]===k) out.push(m[2]); }
  return out;
}
function blankHTML(i,ans,hint,o){
  if(o.phase==='ask'){
    if(o.mode==='type'){
      var w=Math.min(26,Math.max(5,Math.max(ans.length,hint.length)+2));
      var lg=/[а-яё]/i.test(ans)?'ru':'pl';
      return '<input class="blank-input" data-i="'+i+'" lang="'+lg+'" style="width:'+w+'ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+esc(hint)+'" aria-label="Пропуск '+(i+1)+(hint?', подсказка: '+esc(hint):'')+'">';
    }
    return '<span class="gap">['+(hint?esc(hint):'…')+']</span>';
  }
  var r=o.results?o.results[i]:null, typed=(o.vals&&o.vals[i])?o.vals[i]:'', h='';
  if(r&&r!=='ok'&&typed) h+='<del>'+esc(typed)+'</del> ';
  return h+'<span class="ans'+(r==='accent'?' accent':'')+'">'+esc(ans)+'</span>';
}
function buildFront(text,k,o){
  var re=/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, out='', last=0, m, bi=0;
  while((m=re.exec(text))){
    out+=sanitize(text.slice(last,m.index)); last=re.lastIndex;
    if(+m[1]===k){ out+=blankHTML(bi,m[2],m[3]||'',o); bi++; }
    else out+=sanitize(m[2]);
  }
  return out+sanitize(text.slice(last));
}
function tableHTML(n,o){
  var bi=0;
  return '<div class="tbl">'+n.rows.map(function(r){
    var cr=CASE_ROWS[r[0]];
    var lab=cr?'<b>'+cr[0]+'</b> · '+cr[1]:sanitize(r[0]);
    var pre=cr&&cr[2]?'<span class="pre">'+cr[2]+'</span> ':'';
    if(!r[2]&&pre&&o.vals&&o.vals[bi]){ var v=o.vals[bi].trim(); if(v.toLowerCase().indexOf(cr[2]+' ')===0) o.vals[bi]=v.slice(cr[2].length+1); }
    var cell=r[2]?'<span class="given">'+esc(r[1])+'</span>':blankHTML(bi++,r[1],'',o);
    return '<div class="trow"><div class="tlab">'+lab+'</div><div class="tcell">'+pre+cell+'</div></div>';
  }).join('')+'</div>';
}
function choiceHTML(n){
  if(!cur.order) cur.order=shuffle(n.options.map(function(_,i){return i;}));
  var done=cur.phase==='answer';
  return '<div class="opts">'+cur.order.map(function(i,j){
    var o=n.options[i], cls='btn opt';
    if(done){ if(o===n.answer) cls+=' ok'; else if(i===cur.pick) cls+=' bad'; }
    return '<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(done?' disabled':'')+'><span class="num">'+(j+1)+'</span><span>'+sanitize(o)+'</span></button>';
  }).join('')+'</div>';
}
/* что нужно ввести: [{a: ответ, pre: предлог перед полем, row: падеж строки}] */
function expected(n,k){
  if(n.type==='cloze') return extractAnswers(n.text,k).map(function(a){return {a:a,pre:'',row:null};});
  if(n.type==='table') return n.rows.filter(function(r){return !r[2];}).map(function(r){
    var cr=CASE_ROWS[r[0]]; return {a:r[1],pre:(cr&&cr[2])||'',row:cr?r[0]:null};
  });
  return [];
}

/* ---------- answer checking ---------- */
function norm(s){return String(s).normalize('NFC').toLowerCase().replace(/ё/g,'е').replace(/[«»"'.!?;:]/g,'').replace(/\s+/g,' ').trim();}
function strip(s){return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').normalize('NFC');}
function toks(s){return norm(s).split(/[,\s]+/).filter(Boolean).sort().join(' ');}
function cmp1(u,a){
  var list=a.indexOf(',')>=0;
  var f=list?toks:norm, g=list?function(x){return toks(strip(x));}:strip;
  if(f(u)===f(a)) return 'ok';
  if(g(u)===g(a)) return S.cfg.lenient?'ok':'accent';
  return 'bad';
}
/* «mi / mnie» в ответе — подходит любой вариант; предлог перед полем можно не писать */
function cmp(u,a,pre){
  u=String(u);
  if(pre&&norm(u).indexOf(pre+' ')===0) u=norm(u).slice(pre.length+1);
  var best='bad';
  a.split('/').map(function(x){return x.trim();}).filter(Boolean).forEach(function(x){
    var r=cmp1(u,x); if(r==='ok') best='ok'; else if(r==='accent'&&best!=='ok') best='accent';
  });
  return best;
}

/* ---------- parsing (формат импорта Anki: текст<TAB>пояснение<TAB>теги) ---------- */
function unq(f){ f=(f||'').trim(); return (f.length>1&&f.charAt(0)==='"'&&f.slice(-1)==='"')?f.slice(1,-1).replace(/""/g,'"'):f; }
function parseNotes(text){
  var out=[];
  String(text).split(/\r?\n/).forEach(function(line){
    if(!line.trim()||line.charAt(0)==='#') return;
    var f=line.split('\t'); if(f.length<2) f=line.split(' | ');
    var t=unq(f[0]);
    if(!t||!/\{\{c\d+::/.test(t)) return;
    out.push(legacyItem(t,unq(f[1]),unq(f[2])));
  });
  return out;
}
function parsePack(file,text){
  if(/\.json$/i.test(file)){
    var o=JSON.parse(text);
    return {title:o.title,items:(o.items||[]).map(normItem).filter(Boolean)};
  }
  return {items:parseNotes(text)};
}

/* ---------- state: create / load / save ---------- */
function newState(){
  return {v:2,updated:0,seq:0,cards:{},cfg:Object.assign({},DEF),daily:{day:-1,newDone:0,extra:0},
          buried:{},log:[],packs:{},hidden:{},local:[],drills:{},dstat:{}};
}
function migrate(){
  S.cfg=Object.assign({},DEF,S.cfg||{});
  S.daily=S.daily||{day:-1,newDone:0,extra:0};
  S.buried=S.buried||{}; S.log=S.log||[]; S.cards=S.cards||{}; S.seq=S.seq||0;
  S.packs=S.packs||{}; S.hidden=S.hidden||{}; S.drills=S.drills||{}; S.dstat=S.dstat||{};
  S.local=(S.local||[]).map(function(n){ return n.type?n:legacyItem(n.text,n.extra,n.tags); });
}
function loadJSON(k){ try{ var raw=localStorage.getItem(k); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); saveFailed=false; }catch(e){ saveFailed=true; }
}
function saveContent(){ try{ localStorage.setItem(CKEY,JSON.stringify(C)); }catch(e){} }
function persist(){ S.updated=Date.now(); saveLocal(); }
function packTitle(id){
  if(id==='local') return 'Мои заметки';
  for(var i=0;i<C.packs.length;i++) if(C.packs[i].id===id) return C.packs[i].title;
  return id;
}
function packOn(id){ return !(S.packs[id]&&S.packs[id].off); }

/* ---------- content → active notes → cards ---------- */
function buildNotes(){
  NOTES={}; NOTE_LIST=[];
  var lv=S.cfg.levels;
  var add=function(it,src,pi,ii){
    if(!it||lv.indexOf(it.level)<0) return;
    var id=noteId(it); if(NOTES[id]||S.hidden[id]) return;
    var o=Object.assign({},it,{id:id,src:src,pi:pi,ii:ii});
    NOTES[id]=o; NOTE_LIST.push(o);
  };
  C.packs.forEach(function(p,pi){ if(packOn(p.id)) p.items.forEach(function(it,ii){add(it,p.id,pi,ii);}); });
  /* ошибки из тренировки идут в очередь новых первыми: их отправили в повторения специально */
  S.local.forEach(function(it,ii){add(normItem(it),'local',(it.tags||[]).indexOf('drill')>=0?-1:999,ii);});
}
function knownIds(){
  var o={};
  C.packs.forEach(function(p){ p.items.forEach(function(it){o[noteId(it)]=1;}); });
  S.local.forEach(function(it){o[noteId(it)]=1;});
  return o;
}
/* Создаёт карточки для новых заметок. Прогресс по заметкам, которых сейчас нет
   (пакет или уровень выключен, пакет удалён), не трогается: вернётся заметка — вернётся и прогресс. */
function ensureCards(){
  var added=[];
  NOTE_LIST.forEach(function(n){
    cardNums(n).forEach(function(k){
      var id=n.id+'-'+k;
      if(!S.cards[id]){
        S.cards[id]={n:n.id,k:k,st:'new',step:0,due:0,dueDay:0,ivl:0,ease:S.cfg.startEase,lapses:0,reps:0,ord:S.seq++};
        added.push(n.src);
      }
    });
  });
  return added;
}
function applyContent(){
  buildNotes();
  var added=ensureCards();
  if(!added.length) return '';
  persist();
  var by={}, order=[];
  added.forEach(function(s){ if(!by[s]){by[s]=0;order.push(s);} by[s]++; });
  return 'Новые карточки: '+order.map(function(s){return '«'+packTitle(s)+'» +'+by[s];}).join(', ')+'.';
}

/* ---------- server packs ---------- */
function setNet(s){ net.status=s; var el=$('#netst'); if(el) el.textContent=s; }
function refreshPacks(manual){
  if(net.busy) return;
  if(location.protocol==='file:'){ setNet('Страница открыта как файл с диска: колода с сервера недоступна.'); return; }
  net.busy=true; setNet('Проверяю обновления…');
  fetch('packs/index.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  }).then(function(idx){
    var prev={};
    C.packs.forEach(function(p){prev[p.id]=p;});
    return Promise.all(((idx&&idx.packs)||[]).map(function(p){
      var old=prev[p.id];
      if(old&&p.hash&&old.hash===p.hash) return Object.assign({},old,{title:p.title||old.title});
      return fetch(p.file+'?v='+encodeURIComponent(p.hash||Date.now())).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
      }).then(function(t){
        var pk=parsePack(p.file,t);
        return {id:p.id,title:p.title||pk.title||p.id,hash:p.hash||'',items:pk.items};
      }).catch(function(){ return old||null; });
    }));
  }).then(function(packs){
    C={packs:packs.filter(Boolean),checked:Date.now()}; saveContent();
    var msg=applyContent();
    if(msg) notice=msg;
    net.busy=false;
    setNet('Колода проверена '+fmtWhen(C.checked)+'.');
    if(manual&&tab==='deck'){ renderDeck($('#view')); flashMsg(msg||'Новых карточек нет.'); }
    else if(tab==='study'&&(!cur||(msg&&cur.phase==='answer'))) render();
  }).catch(function(){
    net.busy=false;
    setNet('Нет связи с сервером. Работаю с сохранённой колодой'+(C.checked?' ('+fmtWhen(C.checked)+')':'')+'.');
  });
}

/* ---------- scheduler ---------- */
function schedule(c,g,cfg,now){
  var r=Object.assign({},c), td=todayIdx();
  r.reps=(c.reps||0)+1;
  var learning=(c.st==='new'||c.st==='learn'||c.st==='relearn');
  if(learning){
    var relearn=(c.st==='relearn');
    var steps=relearn?cfg.relearnSteps:cfg.steps;
    var step=(c.st==='new')?0:(c.step||0);
    var base=relearn?(c.relearnIvl||1):cfg.gradIvl;
    var grad=function(ivl){ r.st='review'; r.step=0; r.ivl=Math.min(ivl,Math.max(cfg.maxIvl,1)); r.dueDay=td+r.ivl; r.due=0; };
    var keep=relearn?'relearn':'learn';
    if(g===1){ r.st=keep; r.step=0; r.due=now+steps[0]*MIN; }
    else if(g===2){ r.st=keep; r.step=step; r.due=now+steps[step]*MIN; }
    else if(g===3){
      if(step+1>=steps.length) grad(base);
      else { r.st=keep; r.step=step+1; r.due=now+steps[step+1]*MIN; }
    } else grad(relearn?base+1:cfg.easyIvl);
    if(r.st!=='review') r.dueDay=0;
  } else {
    var ivl=c.ivl||1, ease=c.ease||cfg.startEase;
    if(g===1){
      r.lapses=(c.lapses||0)+1; r.ease=Math.max(1.3,ease-0.2);
      r.st='relearn'; r.step=0; r.relearnIvl=Math.max(1,Math.round(ivl*0.4));
      r.due=now+cfg.relearnSteps[0]*MIN; r.dueDay=0;
    } else {
      var ni;
      if(g===2){ ni=Math.max(ivl+1,Math.round(ivl*1.2)); r.ease=Math.max(1.3,ease-0.15); }
      else if(g===3){ ni=Math.max(ivl+1,Math.round(ivl*ease*cfg.ivlMod)); }
      else { ni=Math.max(ivl+2,Math.round(ivl*ease*cfg.ivlMod*1.3)); r.ease=ease+0.15; }
      r.ivl=Math.min(ni,Math.max(cfg.maxIvl,ivl)); r.dueDay=td+r.ivl;
    }
  }
  return r;
}
function previewLabel(c,g){
  var now=Date.now(), r=schedule(c,g,S.cfg,now);
  if(r.st==='review') return fmtDays(r.ivl);
  return fmtMin(Math.max(1,Math.round((r.due-now)/MIN)));
}

/* ---------- queue ---------- */
function ensureDaily(){
  var td=todayIdx();
  if(S.daily.day!==td) S.daily={day:td,newDone:0,extra:0};
  Object.keys(S.buried).forEach(function(k){ if(S.buried[k]!==td) delete S.buried[k]; });
}
function newLimit(){ return S.cfg.newPerDay+(S.daily.extra||0); }
function allCards(){
  return Object.keys(S.cards).filter(function(id){return NOTES[S.cards[id].n];}).map(function(id){return {id:id,c:S.cards[id]};});
}
function isLearn(c){ return c.st==='learn'||c.st==='relearn'; }
/* новые карточки: сперва ошибки из тренировки, дальше от лёгких к сложным — уровень, пакет, порядок в пакете */
function newOrder(a,b){
  var A=NOTES[a.c.n], B=NOTES[b.c.n];
  return ((A.pi<0)-(B.pi<0))*-1||(A.level-B.level)||(A.pi-B.pi)||(A.ii-B.ii)||(a.c.k-b.c.k);
}
function queueCounts(){
  ensureDaily();
  var td=todayIdx(), nwTotal=0, lrn=0, rev=0;
  allCards().forEach(function(x){
    var c=x.c;
    if(c.st==='new') nwTotal++;
    else if(c.st==='review'){ if(c.dueDay<=td) rev++; }
    else lrn++;
  });
  return {nw:Math.max(0,Math.min(nwTotal,newLimit()-S.daily.newDone)),nwTotal:nwTotal,lrn:lrn,rev:rev};
}
function pickNext(){
  ensureDaily();
  var now=Date.now(), td=todayIdx(), list=allCards();
  var dl2=list.filter(function(x){return isLearn(x.c)&&x.c.due<=now;}).sort(function(a,b){return a.c.due-b.c.due;});
  if(dl2.length) return dl2[0].id;
  var rev=list.filter(function(x){return x.c.st==='review'&&x.c.dueDay<=td&&S.buried[x.c.n]!==td;});
  var nl=newLimit()-S.daily.newDone;
  var nw=nl>0?list.filter(function(x){return x.c.st==='new'&&S.buried[x.c.n]!==td;}).sort(newOrder):[];
  if(rev.length&&nw.length){
    var pn=Math.min(nw.length,nl);
    return Math.random()<rev.length/(rev.length+pn)?rev[Math.floor(Math.random()*rev.length)].id:nw[0].id;
  }
  if(rev.length) return rev[Math.floor(Math.random()*rev.length)].id;
  if(nw.length) return nw[0].id;
  return null;
}
function startCard(id){ if(confirmKey==='hide') confirmKey=null; cur={id:id,phase:'ask',t0:Date.now(),vals:[],results:null,sug:null,tr:false,order:null,pick:null,x:null}; }

function doCheck(giveUp){
  var c=S.cards[cur.id]; if(!c) return;
  var n=NOTES[c.n], exp=expected(n,c.k);
  var inputs=[].slice.call(document.querySelectorAll('.blank-input'));
  cur.vals=inputs.map(function(i){return i.value;});
  cur.results=exp.map(function(e,i){return giveUp?'bad':cmp(cur.vals[i]||'',e.a,e.pre);});
  var bad=cur.results.filter(function(r){return r==='bad';}).length, accent=cur.results.indexOf('accent')>=0;
  if(giveUp) cur.sug=1;
  else if(n.type==='table') cur.sug=bad===0?(accent?2:3):(bad===1?2:1);
  else cur.sug=bad?1:(accent?2:3);
  /* по таблице склонения статистика считается по каждому падежу отдельно */
  if(n.type==='table') cur.x=exp.map(function(e,i){return e.row?[e.row,cur.results[i]==='bad'?0:1]:null;}).filter(Boolean);
  cur.phase='answer'; render();
}
function pick(i){
  var n=NOTES[S.cards[cur.id].n], ok=n.options[i]===n.answer;
  cur.pick=i; cur.results=[ok?'ok':'bad']; cur.sug=ok?3:1; cur.phase='answer'; render();
}
function reveal(){ cur.phase='answer'; cur.results=null; cur.sug=null; render(); }
function grade(g){
  if(!cur||cur.phase!=='answer') return;
  var c=S.cards[cur.id]; if(!c){ cur=null; render(); return; }
  var now=Date.now(), td=todayIdx(), wasNew=(c.st==='new');
  undoRec={id:cur.id,card:JSON.stringify(c),daily:JSON.stringify(S.daily),bur:S.buried[c.n],nid:c.n,logLen:S.log.length};
  S.cards[cur.id]=schedule(c,g,S.cfg,now);
  if(wasNew) S.daily.newDone++;
  S.buried[c.n]=td;
  var e={t:now,c:cur.id,g:g,s:c.st==='review'?'r':(wasNew?'n':'l')};
  if(cur.x&&cur.x.length) e.x=cur.x;
  S.log.push(e);
  if(S.log.length>LOG_MAX) S.log.splice(0,S.log.length-LOG_MAX);
  notice=''; confirmKey=null;
  persist(); cur=null; render();
}
function undo(){
  if(!undoRec) return;
  var u=undoRec; undoRec=null;
  S.cards[u.id]=JSON.parse(u.card); S.daily=JSON.parse(u.daily);
  if(u.bur===undefined) delete S.buried[u.nid]; else S.buried[u.nid]=u.bur;
  S.log.length=Math.min(S.log.length,u.logLen);
  persist(); startCard(u.id); render();
}

/* генераторы заданий: каждое — строчка с пропуском, ответ, подсказка и перевод */
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function words(){ return [].slice.call(arguments).filter(Boolean).join(' '); }
function split3(t){ var i=t.indexOf('___'); return [t.slice(0,i),t.slice(i+3)]; }
function ruPrep(p,w){
  var lw=w.toLowerCase();
  if(p==='о'&&/^[аоуэи]/.test(lw)) return 'об';
  if(p==='с'&&/^[сзшжщ][^аеёиоуыэюя]/.test(lw)) return 'со';
  if(p==='в'&&/^[вф][^аеёиоуыэюя]/.test(lw)) return 'во';
  if(p==='к'&&/^(мн|вс)/.test(lw)) return 'ко';
  return p;
}
/* «Я думаю {о:prep}.» → «Я думаю об окне.» */
function fillRu(t,get){ return t.replace(/\{(?:([^:{}]+):)?(\w+)\}/g,function(_,p,c){ var w=get(c); return p?ruPrep(p,w)+' '+w:w; }); }
function nForm(n,c,pl){ return pl?n.pln[c==='voc'?0:CI[c]]:n.sg[CI[c]]; }
function nRu(n,c,pl){ return (pl?n.rpl:n.rsg)[RI[c]]; }
function fits(n,t){ return t.only?t.only.indexOf(n.pl)>=0:(!t.cls||n.cls.some(function(x){return t.cls.indexOf(x)>=0;})); }
function nounNote(n,pl,c){
  var ks=['nom','gen','dat','acc','instr','loc'].concat(pl?[]:['voc']);
  return '<b>'+esc(n.pl)+'</b> ('+esc(n.ru)+'), '+(pl?'мн. ч.':'ед. ч.')+': '+ks.map(function(k){
    var f=esc(nForm(n,k,pl)); return ABBR[k]+' '+(k===c?'<b>'+f+'</b>':f);
  }).join(' · ');
}
function qCase(c){
  var t=rnd(LEX.cases[c]), n=rnd(LEX.nouns.filter(function(x){return fits(x,t);}));
  var pl=!!n.pln&&Math.random()<0.4, s=split3(t.pl);
  return {key:'c|'+c+'|'+n.pl+'|'+pl,before:s[0],after:s[1],ans:nForm(n,c,pl),hint:n.pl+(pl?', мн. ч.':''),
    label:CASE_ROWS[c][0]+' · '+(pl?'мн. ч.':'ед. ч.'),ru:fillRu(t.ru,function(k){return nRu(n,k,pl);}),
    note:nounNote(n,pl,c),topic:c,topics:[c],color:c};
}
function qPron(){
  var p=rnd(LEX.pronouns), c=rnd(['gen','dat','acc','instr','loc']), t=LEX.pronCases[c], s=split3(t.pl);
  return {key:'p|'+p.pl+'|'+c,before:s[0],after:s[1],ans:p.f[c],hint:p.pl,label:CASE_ROWS[c][0],
    ru:fillRu(t.ru,function(k){return p.r[k];}),topic:'pron',topics:['pron',c],color:c,
    note:'<b>'+esc(p.pl)+'</b>: '+['gen','dat','acc','instr','loc'].map(function(k){ var f=esc(p.f[k]); return ABBR[k]+' '+(k===c?'<b>'+f+'</b>':f); }).join(' · ')};
}
function qPrep(){
  var t=rnd(LEX.preps), n=rnd(LEX.nouns.filter(function(x){return fits(x,t);}));
  var pl=!t.only&&!!n.pln&&Math.random()<0.3, s=split3(t.pl), ans=nForm(n,t.case,pl);
  return {key:'r|'+t.prep+'|'+t.case+'|'+n.pl+'|'+pl,before:s[0],after:s[1],ans:ans,hint:n.pl+(pl?', мн. ч.':''),
    label:'Предлог '+t.prep+(t.q?' · '+t.q:''),ru:fillRu(t.ru,function(k){return nRu(n,k,pl);}),topic:'prep',topics:['prep',t.case],color:t.case,
    note:'<b>'+esc(t.prep)+' + '+CASE_ROWS[t.case][0]+'</b>'+(t.q?' ('+esc(t.q)+')':'')+': '+esc(n.pl)+' → '+esc(t.prep)+' '+esc(ans)};
}
/* прошедшее: из [ja м.р., on, ona, oni] выводятся остальные формы */
function pastSet(P){
  var fs=P[2].replace(/a$/,'');
  return {m:[P[0],P[0].replace(/em$/,'eś'),P[1]],f:[fs+'am',fs+'aś',P[2]],mp:[P[3]+'śmy',P[3]+'ście',P[3]],fp:[fs+'yśmy',fs+'yście',fs+'y']};
}
function lform(P,g){ return g==='m'?P[1]:g==='f'?P[2]:g==='mp'?P[3]:P[2].replace(/a$/,'')+'y'; }
function rPast(v,g){ return v.rpast[g==='m'?0:g==='f'?1:3]; }
function bold(list,i){ return list.map(function(f,j){ f=esc(f); return j===i?'<b>'+f+'</b>':f; }).join(', '); }
/* mieć по-русски естественнее через «у меня есть»: Mamy czas → У нас есть время */
var HAVE={'я':'у меня','ты':'у тебя','он':'у него','она':'у неё','мы':'у нас','вы':'у вас','они':'у них'};
function qVerb(t){
  var v=rnd(LEX.verbs.filter(function(x){ return t==='imper'?x.imper:t==='futp'?x.perf:true; }));
  var obj=v.obj?' '+v.obj:'', q={topic:TTOPIC[t],topics:[TTOPIC[t]],color:'verb',label:TNAME[t],hint:v.inf,verb:true};
  if(t==='pres'||t==='futi'||t==='futp'){
    var p=rnd(P6), i=p.i;
    q.key='v|'+t+'|'+v.inf+'|'+p.p; q.before=(t==='pres'?'Teraz':'Jutro')+' ('+p.p+') '; q.after=obj+'.';
    if(t==='pres'){
      q.ans=v.pres[i]; q.ru=(v.rhave?words('Сейчас',HAVE[p.r],'есть',v.robj):words('Сейчас',p.r,v.rpres[i],v.robj))+'.';
      q.note='<b>'+esc(v.inf)+'</b>, настоящее: '+bold(v.pres,i);
    } else if(t==='futp'){
      q.hint=v.perf.inf; q.ans=v.perf.fut[i]; q.ru=words('Завтра',p.r,v.perf.rfut[i],v.robj)+'.'; q.topics=['fut','aspect'];
      q.note='<b>'+esc(v.perf.inf)+'</b> — сов. вид к '+esc(v.inf)+'; его «настоящее» значит будущее: '+bold(v.perf.fut,i);
    } else if(v.futSimple){
      q.ans=BEDE[i]; q.ru=words('Завтра',p.r,BUDU[i],v.robj)+'.';
      q.note='<b>być</b>, будущее: '+bold(BEDE,i);
    } else {
      var gs=p.g?[p.g]:(i<3?['m','f']:['mp','fp']);
      q.ans=[BEDE[i]+' '+v.inf].concat(gs.map(function(g){return BEDE[i]+' '+lform(v.past,g);})).join(' / ');
      q.ru=(v.rhave?words('Завтра',HAVE[p.r],'будет',v.robj):words('Завтра',p.r,BUDU[i],v.ru,v.robj))+'.';
      q.note='Несов. вид: <b>'+esc(BEDE[i])+'</b> + инфинитив ('+esc(v.inf)+') или + форма на -ł ('+gs.map(function(g){return esc(lform(v.past,g));}).join(', ')+'). Оба варианта правильные.';
    }
  } else if(t==='past'||t==='cond'){
    var gp=rnd(GP), ps=pastSet(v.past), l=lform(v.past,gp.g);
    q.key='v|'+t+'|'+v.inf+'|'+gp.p; q.after=obj+'.';
    if(t==='past'){
      q.before='Wczoraj ('+gp.p+') '; q.ans=ps[gp.g][gp.i]; q.ru=(v.rhave?words('Вчера',HAVE[gp.r],'было',v.robj):words('Вчера',gp.r,rPast(v,gp.g),v.robj))+'.';
      var rows=[[ps.m[0],ps.f[0]],[ps.m[1],ps.f[1]],[ps.m[2],ps.f[2],ps.f[2].replace(/a$/,'o')],[ps.mp[0],ps.fp[0]],[ps.mp[1],ps.fp[1]],[ps.mp[2],ps.fp[2]]];
      q.note='<b>'+esc(v.inf)+'</b>, прошедшее: '+rows.map(function(r){
        return r.map(function(f){ return f===q.ans?'<b>'+esc(f)+'</b>':esc(f); }).join('/');
      }).join(', ');
    } else {
      var by=BY[gp.g][gp.i];
      q.before=(v.condPlain?'':'Chętnie ')+'('+gp.p+') '; q.ans=l+by+' / '+by+' '+l;
      q.ru=cap(v.rhave?words(HAVE[gp.r],'было бы',v.robj):v.condPlain?words(gp.r,rPast(v,gp.g),'бы',v.robj):words(gp.r,'бы с удовольствием',rPast(v,gp.g),v.robj))+'.';
      q.note='Прошедшее + by + окончание: '+esc(l)+' + '+esc(by)+' → <b>'+esc(l+by)+'</b>. Можно и раздельно: '+esc(by+' '+l)+'.';
    }
  } else {
    var j=rnd([0,1,2]);
    q.key='v|imper|'+v.inf+'|'+j; q.before='('+['ty','my','wy'][j]+') '; q.after=obj+'!';
    q.ans=v.imper[j]; q.ru=cap(words(v.rimper[j],v.robj))+'!';
    q.note='<b>'+esc(v.inf)+'</b>, повелительное: '+bold(v.imper,j);
  }
  return q;
}
function genQ(D){
  if(D.kind==='case') return qCase(rnd(D.cs));
  if(D.kind==='pron') return qPron();
  if(D.kind==='prep') return qPrep();
  return qVerb(rnd(D.t));
}
function startDrill(id){
  var D=DBY[id], qs=[], seen={};
  for(var k=0;qs.length<DRILL_LEN&&k<300;k++){ var q=genQ(D); if(!seen[q.key]){ seen[q.key]=1; qs.push(q); } }
  drill={id:id,qs:qs,i:0,phase:'ask',vals:[],res:null,ok:0,wrong:[],done:false,added:0};
  refShow=false; refBack=false; render(); window.scrollTo(0,0);
}
function dCheck(giveUp){
  if(!drill||drill.phase!=='ask') return;
  var q=drill.qs[drill.i], inp=$('.blank-input'), raw=inp?inp.value:'', u=raw;
  if(!giveUp&&!u.trim()){ if(inp) inp.focus(); return; }
  if(q.verb) u=u.replace(/^\s*(ja|ty|on|ona|ono|my|wy|oni|one)\s+/i,'');
  var r=giveUp?'bad':cmp(u,q.ans,'');
  drill.vals=[raw]; drill.res=[r]; drill.phase='answer';
  if(r==='bad') drill.wrong.push(q); else drill.ok++;
  var st=S.dstat[q.topic]||(S.dstat[q.topic]={n:0,ok:0}); st.n++; if(r!=='bad') st.ok++;
  if(drill.i===drill.qs.length-1){
    var D=S.drills[drill.id]||(S.drills[drill.id]={n:0,ok:0,runs:0});
    D.last=drill.ok+'/'+drill.qs.length; D.at=Date.now(); D.runs++; D.n+=drill.qs.length; D.ok+=drill.ok;
  }
  persist(); render();
}
function dNext(){
  if(!drill||drill.phase!=='answer') return;
  if(drill.i<drill.qs.length-1){ drill.i++; drill.phase='ask'; drill.vals=[]; drill.res=null; }
  else drill.done=true;
  render(); window.scrollTo(0,0);
}

/* ---------- stats ---------- */
function renderStats(v){
  var td=todayIdx(), list=allCards();
  var cnt={nw:0,lrn:0,young:0,mature:0}, fc=[0,0,0,0,0,0,0];
  list.forEach(function(x){
    var c=x.c;
    if(c.st==='new') cnt.nw++;
    else if(c.st==='review'){ if(c.ivl>=21) cnt.mature++; else cnt.young++; var d=Math.max(0,c.dueDay-td); if(d<7) fc[d]++; }
    else { cnt.lrn++; fc[0]++; }
  });
  var total=list.length||1;
  var acc={}; Object.keys(TOPICS).forEach(function(k){acc[k]={n:0,ok:0};});
  var bump=function(k,ok){ if(acc[k]){ acc[k].n++; if(ok) acc[k].ok++; } };
  var today=0, days={}, r30={n:0,ok:0};
  S.log.forEach(function(e){
    var di=dayIdx(e.t); days[di]=1; if(di===td) today++;
    if(e.s==='r'&&Date.now()-e.t<30*DAY){ r30.n++; if(e.g>=2) r30.ok++; }
    var c=S.cards[e.c]; if(!c) return;
    var n=NOTES[c.n]; if(!n) return;
    topicsOf(n,c.k).forEach(function(k){bump(k,e.g>=2);});
    (e.x||[]).forEach(function(p){bump(p[0],!!p[1]);});
  });
  var streak=0, d0=days[td]?td:td-1; while(days[d0]){streak++;d0--;}
  var h='<h2>Сегодня</h2><p>Ответов: <b>'+today+'</b>. Дней подряд: <b>'+streak+'</b>.</p>';
  if(r30.n) h+='<p>Не провалено в повторениях за 30 дней: <b>'+Math.round(100*r30.ok/r30.n)+'%</b> из '+r30.n+'.</p>';
  var segs=[['Новые',cnt.nw,null],['Обучение',cnt.lrn,'var(--c-dat)'],['Молодые',cnt.young,'var(--c-acc)'],['Зрелые',cnt.mature,'var(--c-gen)']];
  var sty=function(s){return s[2]?'background:'+s[2]:'background:var(--muted);opacity:.35';};
  h+='<h2>Карточки</h2><div class="seg">'+segs.map(function(s){return '<i style="width:'+(100*s[1]/total)+'%;'+sty(s)+'"></i>';}).join('')+'</div>'+
     '<div class="legend">'+segs.map(function(s){return '<span><i class="sw" style="'+sty(s)+'"></i>'+s[0]+' <b>'+s[1]+'</b></span>';}).join('')+'</div>'+
     '<p class="hint" style="margin-top:8px">Зрелые: интервал от 21 дня.</p>';
  var mx=Math.max.apply(null,fc.concat([1]));
  h+='<h2>Что ждёт в ближайшие 7 дней</h2><div class="fc">'+fc.map(function(n,i){
    var lab=i===0?'сегодня':(i===1?'завтра':new Date(Date.now()+i*DAY).toLocaleDateString('ru-RU',{weekday:'short'}));
    return '<div><em>'+(n||'')+'</em><i style="height:'+Math.round(80*n/mx)+'px"></i><span>'+lab+'</span></div>';
  }).join('')+'</div>';
  h+='<h2>Где ошибаешься</h2>';
  var any=false;
  GROUPS.forEach(function(g){
    var ks=Object.keys(TOPICS).filter(function(k){return TOPICS[k].g===g[0]&&acc[k].n;});
    if(!ks.length) return; any=true;
    h+='<h3>'+g[1]+'</h3>';
    ks.forEach(function(k){
      var a=acc[k], p=Math.round(100*a.ok/a.n);
      h+='<div class="acc" style="--cc:var(--c-'+colorKey([k])+')"><div class="top"><span>'+esc(topicName(k))+'</span><span>'+p+'% из '+a.n+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
    });
  });
  if(!any) h+='<p class="hint">Пока нет ответов. Здесь появится доля верных ответов по каждой теме: падежам, временам, предлогам.</p>';
  else h+='<p class="hint">Считаются ответы, не оценённые как «Снова»; в таблицах склонения каждый падеж отдельно. Данные по последним '+LOG_MAX+' ответам.</p>';
  var dr=DRILLS.filter(function(D){return S.drills[D.id];});
  h+='<h2>Тренировка</h2>';
  if(dr.length){
    dr.forEach(function(D){
      var st=S.drills[D.id], p=Math.round(100*st.ok/Math.max(1,st.n)), col=D.kind==='verb'?'verb':(D.cs&&D.cs.length===1?D.cs[0]:'none');
      h+='<div class="acc" style="--cc:var(--c-'+col+')"><div class="top"><span>'+esc(D.name)+'</span><span>последний раз '+st.last+' · всего '+p+'% из '+st.n+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
    });
  } else h+='<p class="hint">Здесь появятся результаты тренировок из вкладки «Грамматика».</p>';
  v.innerHTML=h;
}

function importText(txt){
  var arr=parseNotes(txt);
  if(!arr.length){ flashMsg('Не нашёл ни одной заметки с пропуском {{c1::…}}.'); return; }
  var known=knownIds(), dup=0, list=[];
  arr.forEach(function(it){ var id=noteId(it); if(known[id]){dup++;return;} known[id]=1; list.push(it); });
  S.local=S.local.concat(list);
  applyContent(); persist(); renderDeck($('#view'));
  var added=list.reduce(function(s,it){return s+cardNums(it).length;},0);
  var ta=$('#imp'); if(ta&&list.length) ta.value='';
  flashMsg('Добавлено заметок: '+list.length+', карточек: '+added+(dup?'. Уже были в колоде: '+dup:'')+'.');
}

/* ---------- backup ---------- */
function backupJSON(){ return JSON.stringify({app:'padezhi',v:2,saved:Date.now(),state:S}); }
/* Копия из старой версии тренажёра (страница на claude.ai, v1): переносим прогресс
   по совпадающему тексту заметок и свои заметки (id u…). */
function fromV1(o){
  var s=newState(), byId={}, known=knownIds();
  s.cfg=Object.assign({},DEF,o.cfg||{});
  (o.notes||[]).forEach(function(n){
    byId[n.id]=n;
    var it=legacyItem(n.text,n.extra,n.tags), id=noteId(it);
    if(String(n.id).charAt(0)==='u'&&!known[id]){ s.local.push(it); known[id]=1; }
  });
  var map={};
  Object.keys(o.cards||{}).forEach(function(cid){
    var c=o.cards[cid], n=byId[c.n]; if(!n) return;
    var nid=noteId(legacyItem(n.text,n.extra,n.tags)), r=Object.assign({},c); r.n=nid; map[cid]=nid+'-'+c.k; s.cards[map[cid]]=r;
  });
  s.seq=o.seq||0;
  s.log=(o.log||[]).filter(function(e){return map[e.c];}).map(function(e){return Object.assign({},e,{c:map[e.c]});});
  return s;
}
function restoreText(txt){
  try{
    var o=JSON.parse(txt), st=null;
    if(o&&o.app==='padezhi'&&o.state&&o.state.cards) st=o.state;
    else if(o&&o.v===1&&o.notes&&o.cards) st=fromV1(o);
    if(!st) throw new Error('bad');
    S=st; migrate(); cur=null; undoRec=null; applyContent(); persist();
    renderSettings($('#view')); flashMsg('Восстановлено: карточек с прогрессом '+Object.keys(S.cards).filter(function(id){return S.cards[id].st!=='new';}).length+'.');
  }catch(e){ flashMsg('Это не похоже на резервную копию тренажёра.'); }
}
function saveFile(){
  var name='padezhi-progress-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var url=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url); a.remove();},2000);
    S.backupAt=Date.now(); saveLocal();
    flashMsg('Файл '+name+' сохранён в «Загрузки».');
  }catch(e){ $('#bk').value=backupJSON(); flashMsg('Не удалось сохранить файл: скопируй текст из поля.'); }
}

  '<textarea id="bk" rows="4" spellcheck="false" placeholder="Здесь появится JSON. Чтобы восстановить, вставь его сюда." style="margin-top:8px"></textarea>'+
  '<div class="actions"><button class="btn" data-act="bkshow">Показать данные</button><button class="btn" data-act="bkrestore">Восстановить из текста</button></div></details>'+
  '<h3>Сброс</h3><p class="hint">Сбросит прогресс по всем карточкам, колоду и настройки оставит.</p>'+
  '<div class="actions"><button class="btn" data-act="reset">'+(confirmKey==='reset'?'Точно сбросить прогресс?':'Сбросить прогресс')+'</button></div>';
  v.innerHTML=h;
}
function flashMsg(t){ var el=$('#flash'); if(el) el.textContent=t; }

/* ---------- render / events ---------- */
function render(){
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'); });
  var v=$('#view');
  if(tab==='study') renderStudy(v); else if(tab==='ref') renderRef(v); else if(tab==='stats') renderStats(v); else if(tab==='deck') renderDeck(v); else renderSettings(v);
}
function readFile(input,fn){
  var f=input.files&&input.files[0]; if(!f) return;
  var fr=new FileReader(); fr.onload=function(){ fn(String(fr.result)); }; fr.readAsText(f); input.value='';
}
var handlers={
  check:function(){doCheck(false);},
  giveup:function(){doCheck(true);},
  pick:function(t){ if(cur&&cur.phase==='ask') pick(+t.dataset.i); },
  reveal:reveal,
  grade:function(t){grade(+t.dataset.g);},
  undo:undo,
  /* перевод и подтверждение скрытия меняем на месте, чтобы не стереть набранный ответ */
  tr:function(t){
    if(!cur) return; cur.tr=!cur.tr;
    var el=$('#trx'); if(el) el.hidden=!cur.tr;
    t.textContent=cur.tr?'Скрыть перевод':'Показать перевод';
  },
  hide:function(t){
    if(!cur) return;
    if(confirmKey!=='hide'){ confirmKey='hide'; t.textContent='Точно скрыть эту заметку?'; return; }
    confirmKey=null; S.hidden[S.cards[cur.id].n]=Date.now(); buildNotes(); cur=null; undoRec=null; persist();
    notice='Заметка скрыта. Вернуть можно во вкладке «Колода».'; render();
  },
  ref:function(t){
    refBack=(tab==='study'&&cur)?'card':((tab==='ref'&&drill&&!refShow)?'drill':false);
    refShow=true; refTarget=t.dataset.a; tab='ref'; render();
  },
  back:function(){
    if(refBack==='drill'){ refShow=false; refBack=false; }
    else { tab='study'; refBack=false; }
    render(); window.scrollTo(0,0);
  },
  dstart:function(t){ startDrill(t.dataset.id); },
  dagain:function(){ startDrill(drill.id); },
  dresume:function(){ refShow=false; refBack=false; render(); window.scrollTo(0,0); },
  dexit:function(){ drill=null; refShow=false; refBack=false; render(); window.scrollTo(0,0); },
  dcheck:function(){ dCheck(false); },
  dgiveup:function(){ dCheck(true); },
  dnext:dNext,
  dtr:function(t){
    S.cfg.trOn=!S.cfg.trOn; saveLocal();
    var el=$('#trx'); if(el) el.hidden=!S.cfg.trOn;
    t.textContent=S.cfg.trOn?'Скрыть перевод':'Показать перевод';
    if(lastBlank&&document.body.contains(lastBlank)) lastBlank.focus();
  },
  dadd:function(){
    var known=knownIds(), n=0;
    drill.wrong.forEach(function(q){ var it=drillItem(q), id=noteId(it); if(!known[id]){ known[id]=1; S.local.push(it); n++; } });
    drill.added=n||-1; applyContent(); persist(); render();
  },
  learnnow:function(){
    var l=allCards().filter(function(x){return isLearn(x.c);}).sort(function(a,b){return a.c.due-b.c.due;});
    if(l.length){ startCard(l[0].id); render(); }
  },
  morenew:function(){ S.daily.extra=(S.daily.extra||0)+5; persist(); cur=null; render(); },
  key:function(t){
    var el=lastBlank&&document.body.contains(lastBlank)?lastBlank:$('.blank-input'); if(!el) return;
    var s=el.selectionStart==null?el.value.length:el.selectionStart, e=el.selectionEnd==null?s:el.selectionEnd;
    el.value=el.value.slice(0,s)+t.dataset.ch+el.value.slice(e); el.focus(); el.setSelectionRange(s+1,s+1);
  },
  install:function(){
    if(!installEvt) return;
    var e=installEvt; e.prompt();
    e.userChoice.then(function(){ installEvt=null; render(); }).catch(function(){});
  },
  refresh:function(){ refreshPacks(true); },
  hidenote:function(t){ S.hidden[t.dataset.id]=Date.now(); buildNotes(); cur=null; persist(); renderDeck($('#view')); },
  unhide:function(t){ delete S.hidden[t.dataset.id]; applyContent(); cur=null; persist(); renderDeck($('#view')); },
  unhideall:function(){ S.hidden={}; applyContent(); cur=null; persist(); renderDeck($('#view')); },
  delnote:function(t){
    var id=t.dataset.id;
    if(confirmKey!==id){ confirmKey=id; renderDeck($('#view')); return; }
    confirmKey=null;
    S.local=S.local.filter(function(it){return noteId(it)!==id;});
    Object.keys(S.cards).forEach(function(cid){ if(S.cards[cid].n===id) delete S.cards[cid]; });
    buildNotes(); cur=null; undoRec=null; persist(); renderDeck($('#view'));
  },
  import:function(){ importText($('#imp').value); },
  bkshow:function(){ $('#bk').value=backupJSON(); },
  bksave:saveFile,
  bkrestore:function(){ var txt=$('#bk').value.trim(); if(!txt){ flashMsg('Поле пустое.'); return; } restoreText(txt); },
  reset:function(){
    if(confirmKey!=='reset'){ confirmKey='reset'; renderSettings($('#view')); return; }
    confirmKey=null; S.cards={}; S.seq=0; S.log=[]; S.daily={day:-1,newDone:0,extra:0}; S.buried={}; cur=null; undoRec=null;
    ensureCards(); persist(); renderSettings($('#view')); flashMsg('Прогресс сброшен.');
  }
};
function init(){
  var o=loadJSON(KEY); S=(o&&o.v===2)?o:newState(); migrate();
  var cc=loadJSON(CKEY);
  if(cc&&cc.packs){
    cc.packs.forEach(function(p){
      if(!p.items) p.items=(p.notes||[]).map(function(n){return legacyItem(n.text,n.extra,n.tags);});
      delete p.notes;
    });
    C=cc;
  }
  applyContent();
  var view=$('#view');
  view.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t) return;
    var h=handlers[t.dataset.act]; if(h) h(t,e);
  });
  view.addEventListener('focusin',function(e){ if(e.target.classList&&e.target.classList.contains('blank-input')) lastBlank=e.target; });
  view.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='impfile'){ readFile(t,importText); return; }
    if(t.id==='bkfile'){ readFile(t,restoreText); return; }
    if(t.dataset&&t.dataset.pack){
      var pid=t.dataset.pack;
      if(t.checked) delete S.packs[pid]; else S.packs[pid]={off:true};
      applyContent(); cur=null; persist(); renderDeck($('#view')); return;
    }
    var k=t.dataset&&t.dataset.set; if(!k) return;
    var c=S.cfg, ok=true;
    var nums=function(s){return s.split(/[\s,;]+/).map(function(x){return parseFloat(x.replace(',','.'));}).filter(function(x){return x>0&&isFinite(x);});};
    var num=function(lo,hi,def){var x=parseFloat(String(t.value).replace(',','.')); return isFinite(x)?Math.min(hi,Math.max(lo,x)):def;};
    if(k==='lv'){
      var lv=[].slice.call(view.querySelectorAll('[data-set=lv]')).filter(function(x){return x.checked;}).map(function(x){return +x.value;});
      if(lv.length){ c.levels=lv; applyContent(); } else ok=false;
    }
    else if(k==='newPerDay') c.newPerDay=Math.round(num(0,200,c.newPerDay));
    else if(k==='steps'){ var a=nums(t.value); if(a.length) c.steps=a; else ok=false; }
    else if(k==='relearnSteps'){ var b=nums(t.value); if(b.length) c.relearnSteps=b; else ok=false; }
    else if(k==='gradIvl') c.gradIvl=Math.round(num(1,30,c.gradIvl));
    else if(k==='easyIvl') c.easyIvl=Math.round(num(2,60,c.easyIvl));
    else if(k==='ivlMod') c.ivlMod=num(0.4,2,c.ivlMod);
    else if(k==='maxIvl') c.maxIvl=Math.round(num(7,3650,c.maxIvl));
    else if(k==='mode') c.mode=(t.value==='self'?'self':'type');
    else if(k==='lenient') c.lenient=!!t.checked;
    if(c.easyIvl<=c.gradIvl) c.easyIvl=c.gradIvl+1;
    persist(); cur=null;
    renderSettings($('#view')); flashMsg(ok?'Сохранено.':(k==='lv'?'Нужен хотя бы один уровень.':'Не понял значение: оставил прежнее.'));
  });
  document.querySelector('.tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(!b) return;
    tab=b.dataset.tab; confirmKey=null; refBack=false; refShow=false; render(); window.scrollTo(0,0);
  });
  document.addEventListener('keydown',function(e){
    if(e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
    if(tab==='ref'&&drill&&!refShow&&!drill.done){
      var dt=e.target;
      if(e.key!=='Enter') return;
      if(dt.classList&&dt.classList.contains('blank-input')){ e.preventDefault(); dCheck(false); }
      else if(drill.phase==='answer'&&dt.tagName!=='BUTTON'){ e.preventDefault(); dNext(); }
      return;
    }
    if(tab!=='study'||!cur) return;
    var t=e.target;
    if(t.classList&&t.classList.contains('blank-input')){
      if(e.key==='Enter'){
        e.preventDefault();
        var ins=[].slice.call(view.querySelectorAll('.blank-input')), i=ins.indexOf(t);
        if(i>=0&&i<ins.length-1) ins[i+1].focus(); else doCheck(false);
      }
      return;
    }
    if(t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.tagName==='INPUT') return;
    /* preventDefault везде: иначе нажатая цифра впечатается в поле следующей карточки */
    var n=NOTES[S.cards[cur.id].n];
    if(cur.phase==='answer'){
      if(['1','2','3','4'].indexOf(e.key)>=0){ e.preventDefault(); grade(+e.key); }
      else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); grade(cur.sug||3); }
    } else if(n&&n.type==='choice'&&cur.order){
      var j=+e.key-1; if(j>=0&&j<cur.order.length){ e.preventDefault(); pick(cur.order[j]); }
    } else if(S.cfg.mode==='self'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); reveal(); }
  });
  /* приложение на телефоне обычно не закрывают, а сворачивают: при возврате проверяем колоду */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    if(Date.now()-(C.checked||0)>10*MIN) refreshPacks(false);
    if(tab==='study'&&!cur) render();
  });
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(tab==='study'&&(!cur||cur.phase==='answer')||tab==='settings') render(); });
  window.addEventListener('appinstalled',function(){ installEvt=null; render(); });
  render();
  refreshPacks(false);
  if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(function(){});
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
