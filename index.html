<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18202D">
<title>Падежи</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202D; --muted:#5A6676; --line:#D6DBE3;
  --focus:#2B45C4; --bad:#B3261E; --good:#1B7A4A;
  --c-gen:#4650C4; --c-acc:#0C8272; --c-dat:#9A6200; --c-instr:#B0276A;
  --c-loc:#4B7A17; --c-voc:#7A47B5; --c-verb:#3F6C86; --c-none:#5A6676;
  --serif:Literata,Georgia,"Noto Serif","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151C; --surface:#1A212C; --ink:#E7EBF2; --muted:#9AA6B6; --line:#2C3544;
    --focus:#9DB0FF; --bad:#FF8A80; --good:#6FD4A0;
    --c-gen:#9AA4FF; --c-acc:#4FD0BC; --c-dat:#E6B24E; --c-instr:#F28BB8;
    --c-loc:#A5D26A; --c-voc:#C7A3F2; --c-verb:#7EB7D6; --c-none:#9AA6B6;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151C; --surface:#1A212C; --ink:#E7EBF2; --muted:#9AA6B6; --line:#2C3544;
  --focus:#9DB0FF; --bad:#FF8A80; --good:#6FD4A0;
  --c-gen:#9AA4FF; --c-acc:#4FD0BC; --c-dat:#E6B24E; --c-instr:#F28BB8;
  --c-loc:#A5D26A; --c-voc:#C7A3F2; --c-verb:#7EB7D6; --c-none:#9AA6B6;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.app{max-width:680px;margin:0 auto;padding:18px 16px 72px}
h1{font:600 24px/1.2 var(--serif);margin:0 0 10px}
h2{font:600 19px/1.3 var(--serif);margin:30px 0 10px}
h3{font:600 16px/1.3 system-ui,sans-serif;margin:24px 0 8px}
p{margin:0 0 10px}
.hint,.muted{color:var(--muted)}
.hint{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  padding:8px 0;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}

.banner{margin:16px 0 0;padding:10px 14px;background:var(--surface);border-left:3px solid var(--good);font-size:15px}
.banner.warn{border-left-color:var(--bad)}
.banner .btn{margin-top:8px}
.counts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:18px 0 6px;font-size:14px;color:var(--muted)}
.counts b{font-weight:600;color:var(--ink);margin-left:2px}
.counts .on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

.q{margin:26px 0 8px;padding:2px 0 2px 16px;border-left:4px solid var(--cc,var(--c-none))}
.src{font-size:13px;color:var(--muted);margin-bottom:4px}
.sent{font:400 clamp(22px,5.6vw,30px)/1.5 var(--serif);overflow-wrap:anywhere}
.sent i{display:inline-block;margin-top:6px;font-size:.62em;line-height:1.4;color:var(--muted)}
.sent b{font-weight:600}
.blank-input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:2px solid var(--cc,var(--c-none));
  border-radius:0;padding:0 2px;margin:0 1px;text-align:center;max-width:100%;min-width:3ch}
.blank-input:focus{outline:none;background:color-mix(in srgb,var(--cc,var(--c-none)) 14%,transparent)}
.blank-input::placeholder{color:var(--muted);opacity:.75;font-style:italic;font-size:.8em}
.gap{border-bottom:2px solid var(--cc,var(--c-none));padding:0 6px;color:var(--muted);font-style:italic;font-size:.85em}
.ans{color:var(--cc,var(--c-none));font-weight:600}
.ans.accent{text-decoration:underline dotted;text-underline-offset:4px}
.sent del{color:var(--bad);opacity:.85}
.extra{margin:18px 0 6px;padding:10px 14px;background:var(--surface);border-left:3px solid var(--cc,var(--c-none));font-size:15px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.btn{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px;cursor:pointer;transition:background .12s}
.btn:hover{background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 85%,var(--bg))}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn.key{padding:5px 11px;font:500 18px/1.2 var(--serif)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 8px}
.grades .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.grades .btn small{color:var(--muted);font-size:12px}
.grades .btn.sug{outline:2px solid var(--cc,var(--ink));outline-offset:1px}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.undo{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:26px}
.done{margin:34px 0}
.done p{font-size:17px}
.empty{margin:34px 0;color:var(--muted)}

.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:6px 0 8px}
.seg i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.fc{display:flex;align-items:flex-end;gap:8px;height:110px;margin:8px 0 0}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--muted)}
.fc i{display:block;width:100%;background:var(--ink);opacity:.8;border-radius:3px 3px 0 0;min-height:2px}
.fc span{margin-top:4px}
.fc em{font-style:normal;color:var(--ink);font-size:12px;margin-bottom:2px}
.acc{margin:12px 0}
.acc .top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.acc .top span:last-child{color:var(--muted);font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cc,var(--c-none))}

.pack{padding:12px 0;border-top:1px solid var(--line)}
.pack .head{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.pack .head input{width:20px;height:20px;margin:2px 0 0;flex:none}
.pack small{display:block;color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:6px 0 0 32px}
.notes{list-style:none;margin:10px 0 0;padding:0}
.notes li{padding:10px 0;border-top:1px solid var(--line)}
.notes li.off{opacity:.5}
.notes .nt{font:400 15px/1.45 var(--serif);overflow-wrap:anywhere}
.notes .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:4px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
textarea,input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
textarea{resize:vertical;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.row>span{flex:1}
.row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.row input,.row select{width:130px;flex:none}
.row input[type=checkbox]{width:20px;height:20px}
.flash{color:var(--good);font-size:14px;min-height:1.4em;margin-top:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media (max-width:420px){.grades{grid-template-columns:repeat(2,1fr)}.tabs{gap:14px;font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Падежи</h1>
    <nav class="tabs" aria-label="Разделы">
      <button data-tab="study" aria-selected="true">Занятие</button>
      <button data-tab="stats" aria-selected="false">Статистика</button>
      <button data-tab="deck" aria-selected="false">Колода</button>
      <button data-tab="settings" aria-selected="false">Настройки</button>
    </nav>
  </header>
  <main id="view"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
var MIN=60000, DAY=86400000, KEY='pl-trainer-v2', CKEY='pl-trainer-content-v1', LOG_MAX=2000;
var DEF={newPerDay:7,steps:[1,10],relearnSteps:[10],gradIvl:1,easyIvl:4,startEase:2.3,
         ivlMod:0.8,maxIvl:90,mode:'type',lenient:false};
var CASES={
  gen:{ru:'Родительный',pl:'Dopełniacz'},
  acc:{ru:'Винительный',pl:'Biernik'},
  dat:{ru:'Дательный',pl:'Celownik'},
  instr:{ru:'Творительный',pl:'Narzędnik'},
  loc:{ru:'Предложный',pl:'Miejscownik'},
  voc:{ru:'Звательный',pl:'Wołacz'},
  verb:{ru:'Глагольные формы',pl:'czasownik'}
};
var CASE_KEYS=['gen','acc','dat','instr','loc','voc'];

/* ---------- state ----------
   S: прогресс (хранится на устройстве, попадает в резервную копию).
   C: последняя скачанная колода с сервера (packs/index.json + packs/*.txt).
   NOTES: активные заметки (включённые пакеты + свои, без скрытых). */
var S=null, C={packs:[],checked:0}, NOTES={}, NOTE_LIST=[];
var cur=null, tab='study', undoRec=null, lastBlank=null, confirmKey=null;
var notice='', saveFailed=false, installEvt=null;
var net={busy:false,status:''};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function sanitize(html){return esc(html).replace(/&lt;(br|\/i|\/b|i|b)\s*\/?&gt;/gi,'<$1>');}
function dayIdx(ts){var d=new Date(ts-4*3600*1000);return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY);}
function todayIdx(){return dayIdx(Date.now());}
function fmtMin(m){return m<60?m+' мин':(m<1440?Math.round(m/60)+' ч':Math.round(m/1440)+' д');}
function fmtDays(d){return d<14?d+' д':(d<60?Math.round(d/7)+' нед':Math.round(d/30)+' мес');}
function fmtWhen(ts){
  var d=new Date(ts), t=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return dayIdx(ts)===todayIdx()?'сегодня в '+t:d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+' в '+t;
}
function plain(text){return text.replace(/<[^>]*>/g,' ').replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,'[$1]').replace(/\s+/g,' ').trim();}

/* id заметки = хеш её текста: одинаковый текст в любом пакете даёт ту же карточку,
   а исправленный текст считается новой заметкой с чистым прогрессом. */
function cyrb53(str){
  var h1=0xdeadbeef, h2=0x41c6ce57;
  for(var i=0;i<str.length;i++){ var ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
var idCache={};
function noteId(text){
  if(idCache[text]) return idCache[text];
  return (idCache[text]='n'+cyrb53(String(text).normalize('NFC').replace(/\s+/g,' ').trim()).toString(36));
}

/* ---------- cloze ---------- */
function clozeNums(text){
  var re=/\{\{c(\d+)::/g, set={}, m, out=[];
  while((m=re.exec(text))){ if(!set[m[1]]){set[m[1]]=1;out.push(+m[1]);} }
  return out.sort(function(a,b){return a-b;});
}
function extractAnswers(text,k){
  var re=/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, m, out=[];
  while((m=re.exec(text))){ if(+m[1]===k) out.push(m[2]); }
  return out;
}
function blankHTML(i,ans,hint,o){
  if(o.phase==='ask'){
    if(o.mode==='type'){
      var w=Math.min(26,Math.max(5,Math.max(ans.length,hint.length)+2));
      var lg=/[а-яё]/i.test(ans)?'ru':'pl';
      return '<input class="blank-input" data-i="'+i+'" lang="'+lg+'" style="width:'+w+'ch" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+esc(hint)+'" aria-label="Пропуск '+(i+1)+(hint?', подсказка: '+esc(hint):'')+'">';
    }
    return '<span class="gap">['+(hint?esc(hint):'…')+']</span>';
  }
  var r=o.results?o.results[i]:null, typed=(o.vals&&o.vals[i])?o.vals[i]:'', h='';
  if(r&&r!=='ok'&&typed) h+='<del>'+esc(typed)+'</del> ';
  return h+'<span class="ans'+(r==='accent'?' accent':'')+'">'+esc(ans)+'</span>';
}
function buildFront(text,k,o){
  var re=/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g, out='', last=0, m, bi=0;
  while((m=re.exec(text))){
    out+=sanitize(text.slice(last,m.index)); last=re.lastIndex;
    if(+m[1]===k){ out+=blankHTML(bi,m[2],m[3]||'',o); bi++; }
    else out+=sanitize(m[2]);
  }
  return out+sanitize(text.slice(last));
}

/* ---------- answer checking ---------- */
function norm(s){return String(s).normalize('NFC').toLowerCase().replace(/ё/g,'е').replace(/[«»"'.!?;:]/g,'').replace(/\s+/g,' ').trim();}
function strip(s){return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').normalize('NFC');}
function toks(s){return norm(s).split(/[,\s]+/).filter(Boolean).sort().join(' ');}
function cmp(u,a){
  var list=a.indexOf(',')>=0;
  var f=list?toks:norm, g=list?function(x){return toks(strip(x));}:strip;
  if(f(u)===f(a)) return 'ok';
  if(g(u)===g(a)) return S.cfg.lenient?'ok':'accent';
  return 'bad';
}

/* ---------- parsing (формат импорта Anki: текст<TAB>пояснение<TAB>теги) ---------- */
function unq(f){ f=(f||'').trim(); return (f.length>1&&f.charAt(0)==='"'&&f.slice(-1)==='"')?f.slice(1,-1).replace(/""/g,'"'):f; }
function parseNotes(text){
  var out=[];
  String(text).split(/\r?\n/).forEach(function(line){
    if(!line.trim()||line.charAt(0)==='#') return;
    var f=line.split('\t'); if(f.length<2) f=line.split(' | ');
    var t=unq(f[0]);
    if(!t||!/\{\{c\d+::/.test(t)) return;
    out.push({text:t,extra:unq(f[1]),tags:unq(f[2])});
  });
  return out;
}

/* ---------- state: create / load / save ---------- */
function newState(){
  return {v:2,updated:0,seq:0,cards:{},cfg:Object.assign({},DEF),daily:{day:-1,newDone:0,extra:0},
          buried:{},log:[],packs:{},hidden:{},local:[]};
}
function migrate(){
  S.cfg=Object.assign({},DEF,S.cfg||{});
  S.daily=S.daily||{day:-1,newDone:0,extra:0};
  S.buried=S.buried||{}; S.log=S.log||[]; S.cards=S.cards||{}; S.seq=S.seq||0;
  S.packs=S.packs||{}; S.hidden=S.hidden||{}; S.local=S.local||[];
}
function loadJSON(k){ try{ var raw=localStorage.getItem(k); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveLocal(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); saveFailed=false; }catch(e){ saveFailed=true; }
}
function saveContent(){ try{ localStorage.setItem(CKEY,JSON.stringify(C)); }catch(e){} }
function persist(){ S.updated=Date.now(); saveLocal(); }
function noteById(id){ return NOTES[id]||null; }
function packTitle(id){
  if(id==='local') return 'Мои заметки';
  for(var i=0;i<C.packs.length;i++) if(C.packs[i].id===id) return C.packs[i].title;
  return id;
}
function packOn(id){ return !(S.packs[id]&&S.packs[id].off); }
function caseOf(note,k){
  var tg=(note.tags||'').split(/\s+/), cs=tg.filter(function(t){return CASE_KEYS.indexOf(t)>=0;});
  if(cs.length) return cs[Math.min(k-1,cs.length-1)];
  if(tg.indexOf('verb')>=0) return 'verb';
  return null;
}

/* ---------- content → active notes → cards ---------- */
function buildNotes(){
  NOTES={}; NOTE_LIST=[];
  var add=function(n,src){
    var id=noteId(n.text); if(NOTES[id]||S.hidden[id]) return;
    var o={id:id,text:n.text,extra:n.extra||'',tags:n.tags||'',src:src};
    NOTES[id]=o; NOTE_LIST.push(o);
  };
  C.packs.forEach(function(p){ if(packOn(p.id)) p.notes.forEach(function(n){add(n,p.id);}); });
  S.local.forEach(function(n){add(n,'local');});
}
function knownIds(){
  var o={};
  C.packs.forEach(function(p){ p.notes.forEach(function(n){o[noteId(n.text)]=1;}); });
  S.local.forEach(function(n){o[noteId(n.text)]=1;});
  return o;
}
/* Создаёт карточки для новых заметок. Прогресс по заметкам, которых сейчас нет
   (пакет выключен или удалён), не трогается: вернётся пакет — вернётся и прогресс. */
function ensureCards(){
  var added=[];
  NOTE_LIST.forEach(function(n){
    clozeNums(n.text).forEach(function(k){
      var id=n.id+'-'+k;
      if(!S.cards[id]){
        S.cards[id]={n:n.id,k:k,st:'new',step:0,due:0,dueDay:0,ivl:0,ease:S.cfg.startEase,lapses:0,reps:0,ord:S.seq++};
        added.push(n.src);
      }
    });
  });
  return added;
}
function applyContent(){
  buildNotes();
  var added=ensureCards();
  if(!added.length) return '';
  persist();
  var by={}, order=[];
  added.forEach(function(s){ if(!by[s]){by[s]=0;order.push(s);} by[s]++; });
  return 'Новые карточки: '+order.map(function(s){return '«'+packTitle(s)+'» +'+by[s];}).join(', ')+'.';
}

/* ---------- server packs ---------- */
function setNet(s){ net.status=s; var el=$('#netst'); if(el) el.textContent=s; }
function refreshPacks(manual){
  if(net.busy) return;
  if(location.protocol==='file:'){ setNet('Страница открыта как файл с диска: колода с сервера недоступна.'); return; }
  net.busy=true; setNet('Проверяю обновления…');
  fetch('packs/index.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
  }).then(function(idx){
    var prev={};
    C.packs.forEach(function(p){prev[p.id]=p;});
    return Promise.all(((idx&&idx.packs)||[]).map(function(p){
      var old=prev[p.id];
      if(old&&p.hash&&old.hash===p.hash) return Object.assign({},old,{title:p.title||old.title});
      return fetch(p.file+'?v='+encodeURIComponent(p.hash||Date.now())).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status); return r.text();
      }).then(function(t){
        return {id:p.id,title:p.title||p.id,hash:p.hash||'',notes:parseNotes(t)};
      }).catch(function(){ return old||null; });
    }));
  }).then(function(packs){
    C={packs:packs.filter(Boolean),checked:Date.now()}; saveContent();
    var msg=applyContent();
    if(msg) notice=msg;
    net.busy=false;
    setNet('Колода проверена '+fmtWhen(C.checked)+'.');
    if(manual&&tab==='deck'){ renderDeck($('#view')); flashMsg(msg||'Новых карточек нет.'); }
    else if(tab==='study'&&(!cur||(msg&&cur.phase==='answer'))) render();
  }).catch(function(){
    net.busy=false;
    setNet('Нет связи с сервером. Работаю с сохранённой колодой'+(C.checked?' ('+fmtWhen(C.checked)+')':'')+'.');
  });
}

/* ---------- scheduler ---------- */
function schedule(c,g,cfg,now){
  var r=Object.assign({},c), td=todayIdx();
  r.reps=(c.reps||0)+1;
  var learning=(c.st==='new'||c.st==='learn'||c.st==='relearn');
  if(learning){
    var relearn=(c.st==='relearn');
    var steps=relearn?cfg.relearnSteps:cfg.steps;
    var step=(c.st==='new')?0:(c.step||0);
    var base=relearn?(c.relearnIvl||1):cfg.gradIvl;
    var grad=function(ivl){ r.st='review'; r.step=0; r.ivl=Math.min(ivl,Math.max(cfg.maxIvl,1)); r.dueDay=td+r.ivl; r.due=0; };
    var keep=relearn?'relearn':'learn';
    if(g===1){ r.st=keep; r.step=0; r.due=now+steps[0]*MIN; }
    else if(g===2){ r.st=keep; r.step=step; r.due=now+steps[step]*MIN; }
    else if(g===3){
      if(step+1>=steps.length) grad(base);
      else { r.st=keep; r.step=step+1; r.due=now+steps[step+1]*MIN; }
    } else grad(relearn?base+1:cfg.easyIvl);
    if(r.st!=='review') r.dueDay=0;
  } else {
    var ivl=c.ivl||1, ease=c.ease||cfg.startEase;
    if(g===1){
      r.lapses=(c.lapses||0)+1; r.ease=Math.max(1.3,ease-0.2);
      r.st='relearn'; r.step=0; r.relearnIvl=Math.max(1,Math.round(ivl*0.4));
      r.due=now+cfg.relearnSteps[0]*MIN; r.dueDay=0;
    } else {
      var ni;
      if(g===2){ ni=Math.max(ivl+1,Math.round(ivl*1.2)); r.ease=Math.max(1.3,ease-0.15); }
      else if(g===3){ ni=Math.max(ivl+1,Math.round(ivl*ease*cfg.ivlMod)); }
      else { ni=Math.max(ivl+2,Math.round(ivl*ease*cfg.ivlMod*1.3)); r.ease=ease+0.15; }
      r.ivl=Math.min(ni,Math.max(cfg.maxIvl,ivl)); r.dueDay=td+r.ivl;
    }
  }
  return r;
}
function previewLabel(c,g){
  var now=Date.now(), r=schedule(c,g,S.cfg,now);
  if(r.st==='review') return fmtDays(r.ivl);
  return fmtMin(Math.max(1,Math.round((r.due-now)/MIN)));
}

/* ---------- queue ---------- */
function ensureDaily(){
  var td=todayIdx();
  if(S.daily.day!==td) S.daily={day:td,newDone:0,extra:0};
  Object.keys(S.buried).forEach(function(k){ if(S.buried[k]!==td) delete S.buried[k]; });
}
function newLimit(){ return S.cfg.newPerDay+(S.daily.extra||0); }
function allCards(){
  return Object.keys(S.cards).filter(function(id){return NOTES[S.cards[id].n];}).map(function(id){return {id:id,c:S.cards[id]};});
}
function isLearn(c){ return c.st==='learn'||c.st==='relearn'; }
function queueCounts(){
  ensureDaily();
  var td=todayIdx(), nwTotal=0, lrn=0, rev=0;
  allCards().forEach(function(x){
    var c=x.c;
    if(c.st==='new') nwTotal++;
    else if(c.st==='review'){ if(c.dueDay<=td) rev++; }
    else lrn++;
  });
  return {nw:Math.max(0,Math.min(nwTotal,newLimit()-S.daily.newDone)),nwTotal:nwTotal,lrn:lrn,rev:rev};
}
function pickNext(){
  ensureDaily();
  var now=Date.now(), td=todayIdx(), list=allCards();
  var dl2=list.filter(function(x){return isLearn(x.c)&&x.c.due<=now;}).sort(function(a,b){return a.c.due-b.c.due;});
  if(dl2.length) return dl2[0].id;
  var rev=list.filter(function(x){return x.c.st==='review'&&x.c.dueDay<=td&&S.buried[x.c.n]!==td;});
  var nl=newLimit()-S.daily.newDone;
  var nw=nl>0?list.filter(function(x){return x.c.st==='new'&&S.buried[x.c.n]!==td;}).sort(function(a,b){return a.c.ord-b.c.ord;}):[];
  if(rev.length&&nw.length){
    var pn=Math.min(nw.length,nl);
    return Math.random()<rev.length/(rev.length+pn)?rev[Math.floor(Math.random()*rev.length)].id:nw[0].id;
  }
  if(rev.length) return rev[Math.floor(Math.random()*rev.length)].id;
  if(nw.length) return nw[0].id;
  return null;
}
function startCard(id){ cur={id:id,phase:'ask',t0:Date.now(),vals:[],results:null,sug:null}; }

/* ---------- study screen ---------- */
function bannersHTML(){

}

function renderStudy(v){

        '<span class="'+(act==='rev'?'on':'')+'">Повторения <b>'+q.rev+'</b></span></div>';

  var cc='style="--cc:var(--c-'+(ck||'none')+')"';
  h+='<section class="q" '+cc+'><div class="src">'+esc(packTitle(note.src))+'</div><div class="sent">'+front+'</div></section>';
  if(cur.phase==='ask'){
    if(S.cfg.mode==='type'){
      h+='<div class="actions"><button class="btn primary" data-act="check">Проверить</button><button class="btn" data-act="giveup">Не помню</button></div>';
      if(answers.some(function(a){return !/[а-яё]/i.test(a);})){
        h+='<div class="keys" role="group" aria-label="Польские буквы">'+
           'ąćęłńóśźż'.split('').map(function(ch){return '<button type="button" class="btn key" tabindex="-1" data-act="key" data-ch="'+ch+'">'+ch+'</button>';}).join('')+'</div>';
      }
    } else {
      h+='<div class="actions"><button class="btn primary" data-act="reveal">Показать ответ</button></div>';
    }
  } else {
    if(note.extra) h+='<div class="extra" '+cc+'>'+sanitize(note.extra)+'</div>';
    if(cur.results&&cur.results.indexOf('accent')>=0) h+='<p class="note">Буквы совпали без диакритики (ą ę ł…): засчитано как «Трудно». Правильно подчёркнуто точками.</p>';
    var names=['Снова','Трудно','Хорошо','Легко'];
    h+='<div class="grades" '+cc+'>'+[1,2,3,4].map(function(g){
      return '<button class="btn'+(cur.sug===g?' sug':'')+'" data-act="grade" data-g="'+g+'"><span>'+names[g-1]+'</span><small>'+previewLabel(c,g)+'</small></button>';
    }).join('')+'</div>';
  }
  h+='<div class="undo">'+(undoRec?'<button class="link" data-act="undo">Отменить последнюю оценку</button>':'')+
     '<button class="link" data-act="hide">'+(confirmKey==='hide'?'Точно скрыть эту заметку?':'Скрыть эту заметку')+'</button></div>';
  v.innerHTML=h;
  if(cur.phase==='ask'){ var f=v.querySelector('.blank-input'); if(f){ lastBlank=f; try{f.focus({preventScroll:true});}catch(e){f.focus();} } }

function doCheck(giveUp){
  var c=S.cards[cur.id]; if(!c) return;
  var note=noteById(c.n), answers=extractAnswers(note.text,c.k);
  var inputs=[].slice.call(document.querySelectorAll('.blank-input'));
  cur.vals=inputs.map(function(i){return i.value;});
  cur.results=answers.map(function(a,i){return giveUp?'bad':cmp(cur.vals[i]||'',a);});
  var worst=cur.results.indexOf('bad')>=0?'bad':(cur.results.indexOf('accent')>=0?'accent':'ok');
  cur.sug=giveUp?1:(worst==='ok'?3:(worst==='accent'?2:1));
  cur.phase='answer'; render();
}
function reveal(){ cur.phase='answer'; cur.results=null; cur.sug=null; render(); }
function grade(g){
  if(!cur||cur.phase!=='answer') return;
  var c=S.cards[cur.id]; if(!c){ cur=null; render(); return; }
  var now=Date.now(), td=todayIdx(), wasNew=(c.st==='new');
  undoRec={id:cur.id,card:JSON.stringify(c),daily:JSON.stringify(S.daily),bur:S.buried[c.n],nid:c.n,logLen:S.log.length};
  S.cards[cur.id]=schedule(c,g,S.cfg,now);
  if(wasNew) S.daily.newDone++;
  S.buried[c.n]=td;
  S.log.push({t:now,c:cur.id,g:g,s:c.st==='review'?'r':(wasNew?'n':'l')});
  if(S.log.length>LOG_MAX) S.log.splice(0,S.log.length-LOG_MAX);
  notice=''; confirmKey=null;
  persist(); cur=null; render();
}
function undo(){
  if(!undoRec) return;
  var u=undoRec; undoRec=null;
  S.cards[u.id]=JSON.parse(u.card); S.daily=JSON.parse(u.daily);
  if(u.bur===undefined) delete S.buried[u.nid]; else S.buried[u.nid]=u.bur;
  S.log.length=Math.min(S.log.length,u.logLen);
  persist(); startCard(u.id); render();
}

/* ---------- stats ---------- */
function renderStats(v){
  var td=todayIdx(), list=allCards();
  var cnt={nw:0,lrn:0,young:0,mature:0}, fc=[0,0,0,0,0,0,0];
  list.forEach(function(x){
    var c=x.c;
    if(c.st==='new') cnt.nw++;
    else if(c.st==='review'){ if(c.ivl>=21) cnt.mature++; else cnt.young++; var d=Math.max(0,c.dueDay-td); if(d<7) fc[d]++; }
    else { cnt.lrn++; fc[0]++; }
  });
  var total=list.length||1;
  var acc={}; CASE_KEYS.concat(['verb']).forEach(function(k){acc[k]={n:0,ok:0};});
  var today=0, days={}, r30={n:0,ok:0};
  S.log.forEach(function(e){
    var di=dayIdx(e.t); days[di]=1; if(di===td) today++;
    if(e.s==='r'&&Date.now()-e.t<30*DAY){ r30.n++; if(e.g>=2) r30.ok++; }
    var c=S.cards[e.c]; if(!c) return;
    var n=noteById(c.n); if(!n) return;
    var k=caseOf(n,c.k); if(!k||!acc[k]) return;
    acc[k].n++; if(e.g>=2) acc[k].ok++;
  });
  var streak=0, d0=days[td]?td:td-1; while(days[d0]){streak++;d0--;}
  var h='<h2>Сегодня</h2><p>Ответов: <b>'+today+'</b>. Дней подряд: <b>'+streak+'</b>.</p>';
  if(r30.n) h+='<p>Не провалено в повторениях за 30 дней: <b>'+Math.round(100*r30.ok/r30.n)+'%</b> из '+r30.n+'.</p>';
  var segs=[['Новые',cnt.nw,null],['Обучение',cnt.lrn,'var(--c-dat)'],['Молодые',cnt.young,'var(--c-acc)'],['Зрелые',cnt.mature,'var(--c-gen)']];
  var sty=function(s){return s[2]?'background:'+s[2]:'background:var(--muted);opacity:.35';};
  h+='<h2>Карточки</h2><div class="seg">'+segs.map(function(s){return '<i style="width:'+(100*s[1]/total)+'%;'+sty(s)+'"></i>';}).join('')+'</div>'+
     '<div class="legend">'+segs.map(function(s){return '<span><i class="sw" style="'+sty(s)+'"></i>'+s[0]+' <b>'+s[1]+'</b></span>';}).join('')+'</div>'+
     '<p class="hint" style="margin-top:8px">Зрелые: интервал от 21 дня.</p>';
  var mx=Math.max.apply(null,fc.concat([1]));
  h+='<h2>Что ждёт в ближайшие 7 дней</h2><div class="fc">'+fc.map(function(n,i){
    var lab=i===0?'сегодня':(i===1?'завтра':new Date(Date.now()+i*DAY).toLocaleDateString('ru-RU',{weekday:'short'}));
    return '<div><em>'+(n||'')+'</em><i style="height:'+Math.round(80*n/mx)+'px"></i><span>'+lab+'</span></div>';
  }).join('')+'</div>';
  h+='<h2>Где ошибаешься</h2>';
  var any=false;
  CASE_KEYS.concat(['verb']).forEach(function(k){
    var a=acc[k]; if(!a.n) return; any=true;
    var p=Math.round(100*a.ok/a.n);
    h+='<div class="acc" style="--cc:var(--c-'+k+')"><div class="top"><span>'+CASES[k].ru+' ('+CASES[k].pl+')</span><span>'+p+'% из '+a.n+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
  });
  if(!any) h+='<p class="hint">Пока нет ответов. Здесь появится доля верных ответов по каждому падежу.</p>';
  else h+='<p class="hint">Считаются ответы, не оценённые как «Снова». Данные по последним '+LOG_MAX+' ответам.</p>';
  v.innerHTML=h;
}

function importText(txt){
  var arr=parseNotes(txt);
  if(!arr.length){ flashMsg('Не нашёл ни одной заметки с пропуском {{c1::…}}.'); return; }
  var known=knownIds(), dup=0, list=[];
  arr.forEach(function(n){ var id=noteId(n.text); if(known[id]){dup++;return;} known[id]=1; list.push(n); });
  S.local=S.local.concat(list);
  applyContent(); persist(); renderDeck($('#view'));
  var added=list.reduce(function(s,n){return s+clozeNums(n.text).length;},0);
  var ta=$('#imp'); if(ta&&list.length) ta.value='';
  flashMsg('Добавлено заметок: '+list.length+', карточек: '+added+(dup?'. Уже были в колоде: '+dup:'')+'.');
}

/* ---------- backup ---------- */
function backupJSON(){ return JSON.stringify({app:'padezhi',v:2,saved:Date.now(),state:S}); }
/* Копия из старой версии тренажёра (страница на claude.ai, v1): переносим прогресс
   по совпадающему тексту заметок и свои заметки (id u…). */
function fromV1(o){
  var s=newState(), byId={}, known=knownIds();
  s.cfg=Object.assign({},DEF,o.cfg||{});
  (o.notes||[]).forEach(function(n){
    byId[n.id]=n;
    var id=noteId(n.text);
    if(String(n.id).charAt(0)==='u'&&!known[id]){ s.local.push({text:n.text,extra:n.extra||'',tags:n.tags||''}); known[id]=1; }
  });
  var map={};
  Object.keys(o.cards||{}).forEach(function(cid){
    var c=o.cards[cid], n=byId[c.n]; if(!n) return;
    var nid=noteId(n.text), r=Object.assign({},c); r.n=nid; map[cid]=nid+'-'+c.k; s.cards[map[cid]]=r;
  });
  s.seq=o.seq||0;
  s.log=(o.log||[]).filter(function(e){return map[e.c];}).map(function(e){return Object.assign({},e,{c:map[e.c]});});
  return s;
}
function restoreText(txt){
  try{
    var o=JSON.parse(txt), st=null;
    if(o&&o.app==='padezhi'&&o.state&&o.state.cards) st=o.state;
    else if(o&&o.v===1&&o.notes&&o.cards) st=fromV1(o);
    if(!st) throw new Error('bad');
    S=st; migrate(); cur=null; undoRec=null; applyContent(); persist();
    renderSettings($('#view')); flashMsg('Восстановлено: карточек с прогрессом '+Object.keys(S.cards).filter(function(id){return S.cards[id].st!=='new';}).length+'.');
  }catch(e){ flashMsg('Это не похоже на резервную копию тренажёра.'); }
}
function saveFile(){
  var name='padezhi-progress-'+new Date().toISOString().slice(0,10)+'.json';
  try{
    var url=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url); a.remove();},2000);
    S.backupAt=Date.now(); saveLocal();
    flashMsg('Файл '+name+' сохранён в «Загрузки».');
  }catch(e){ $('#bk').value=backupJSON(); flashMsg('Не удалось сохранить файл: скопируй текст из поля.'); }
}

/* ---------- settings ---------- */
function setRow(label,hint,inner){ return '<label class="row"><span>'+label+(hint?'<small>'+hint+'</small>':'')+'</span>'+inner+'</label>'; }
function renderSettings(v){
  var c=S.cfg;
  var h='<h2>Настройки</h2>'+
  setRow('Новых карточек в день','Соседние карточки одной заметки откладываются на следующий день.','<input type="number" min="0" max="200" data-set="newPerDay" value="'+c.newPerDay+'">')+
  setRow('Шаги обучения, мин','Через сколько минут повторять новую карточку, пока она не «выпустится» в повторения.','<input type="text" data-set="steps" value="'+c.steps.join(' ')+'">')+
  setRow('Шаги после ошибки, мин','Для карточки, которую забыл в повторениях.','<input type="text" data-set="relearnSteps" value="'+c.relearnSteps.join(' ')+'">')+
  setRow('Первый интервал, дни','После «Хорошо» на последнем шаге.','<input type="number" min="1" max="30" data-set="gradIvl" value="'+c.gradIvl+'">')+
  setRow('Первый интервал после «Легко», дни','','<input type="number" min="2" max="60" data-set="easyIvl" value="'+c.easyIvl+'">')+
  setRow('Множитель интервалов','1 даёт обычный рост интервалов (×ease), меньше 1 делает повторения чаще. По умолчанию 0,8: для навыка употребления форм короткие интервалы выглядят безопаснее длинных.','<input type="number" min="0.4" max="2" step="0.05" data-set="ivlMod" value="'+c.ivlMod+'">')+
  setRow('Максимальный интервал, дни','','<input type="number" min="7" max="3650" data-set="maxIvl" value="'+c.maxIvl+'">')+
  setRow('Режим ответа','Ввод с проверкой или самооценка.','<select data-set="mode"><option value="type"'+(c.mode==='type'?' selected':'')+'>Печатать ответ</option><option value="self"'+(c.mode==='self'?' selected':'')+'>Самооценка</option></select>')+
  setRow('Не штрафовать за диакритику','Если включено, ответ без ą ę ł ś и т. п. (например, «zrodlo» вместо «źródło») засчитывается как верный.','<input type="checkbox" data-set="lenient"'+(c.lenient?' checked':'')+'>')+
  '<div class="flash" id="flash"></div>'+
  (installEvt?'<h3>Приложение</h3><div class="actions"><button class="btn" data-act="install">Установить как приложение</button></div>':'')+
  '<h3>Резервная копия прогресса</h3><p class="hint">Прогресс хранится только на этом устройстве. Сохраняй копию время от времени: если очистить данные браузера, без неё прогресс пропадёт. Карточки из колоды при этом не теряются, они скачаются заново.'+
  (S.backupAt?' Последняя копия: '+fmtWhen(S.backupAt)+'.':'')+'</p>'+
  '<div class="actions"><button class="btn" data-act="bksave">Сохранить копию</button>'+
  '<label class="btn">Загрузить копию…<input type="file" id="bkfile" class="vh" accept=".json,application/json"></label></div>'+
  '<details><summary>Через текст, если файлы не работают</summary>'+
  '<textarea id="bk" rows="4" spellcheck="false" placeholder="Здесь появится JSON. Чтобы восстановить, вставь его сюда." style="margin-top:8px"></textarea>'+
  '<div class="actions"><button class="btn" data-act="bkshow">Показать данные</button><button class="btn" data-act="bkrestore">Восстановить из текста</button></div></details>'+
  '<h3>Сброс</h3><p class="hint">Сбросит прогресс по всем карточкам, колоду и настройки оставит.</p>'+
  '<div class="actions"><button class="btn" data-act="reset">'+(confirmKey==='reset'?'Точно сбросить прогресс?':'Сбросить прогресс')+'</button></div>';
  v.innerHTML=h;
}
function flashMsg(t){ var el=$('#flash'); if(el) el.textContent=t; }

/* ---------- render / events ---------- */
function render(){
  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){ b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'); });
  var v=$('#view');
  if(tab==='study') renderStudy(v); else if(tab==='stats') renderStats(v); else if(tab==='deck') renderDeck(v); else renderSettings(v);
}
function readFile(input,fn){
  var f=input.files&&input.files[0]; if(!f) return;
  var fr=new FileReader(); fr.onload=function(){ fn(String(fr.result)); }; fr.readAsText(f); input.value='';
}
var handlers={
  check:function(){doCheck(false);},
  giveup:function(){doCheck(true);},
  reveal:reveal,
  grade:function(t){grade(+t.dataset.g);},
  undo:undo,
  hide:function(){
    if(!cur) return;
    if(confirmKey!=='hide'){ confirmKey='hide'; render(); return; }
    confirmKey=null; S.hidden[S.cards[cur.id].n]=Date.now(); buildNotes(); cur=null; undoRec=null; persist();
    notice='Заметка скрыта. Вернуть можно во вкладке «Колода».'; render();
  },
  learnnow:function(){
    var l=allCards().filter(function(x){return isLearn(x.c);}).sort(function(a,b){return a.c.due-b.c.due;});
    if(l.length){ startCard(l[0].id); render(); }
  },
  morenew:function(){ S.daily.extra=(S.daily.extra||0)+5; persist(); cur=null; render(); },
  key:function(t){
    var el=lastBlank&&document.body.contains(lastBlank)?lastBlank:$('.blank-input'); if(!el) return;
    var s=el.selectionStart==null?el.value.length:el.selectionStart, e=el.selectionEnd==null?s:el.selectionEnd;
    el.value=el.value.slice(0,s)+t.dataset.ch+el.value.slice(e); el.focus(); el.setSelectionRange(s+1,s+1);
  },
  install:function(){
    if(!installEvt) return;
    var e=installEvt; e.prompt();
    e.userChoice.then(function(){ installEvt=null; render(); }).catch(function(){});
  },
  refresh:function(){ refreshPacks(true); },
  hidenote:function(t){ S.hidden[t.dataset.id]=Date.now(); buildNotes(); cur=null; persist(); renderDeck($('#view')); },
  unhide:function(t){ delete S.hidden[t.dataset.id]; applyContent(); cur=null; persist(); renderDeck($('#view')); },
  unhideall:function(){ S.hidden={}; applyContent(); cur=null; persist(); renderDeck($('#view')); },
  delnote:function(t){
    var id=t.dataset.id;
    if(confirmKey!==id){ confirmKey=id; renderDeck($('#view')); return; }
    confirmKey=null;
    S.local=S.local.filter(function(n){return noteId(n.text)!==id;});
    Object.keys(S.cards).forEach(function(cid){ if(S.cards[cid].n===id) delete S.cards[cid]; });
    buildNotes(); cur=null; undoRec=null; persist(); renderDeck($('#view'));
  },
  import:function(){ importText($('#imp').value); },
  bkshow:function(){ $('#bk').value=backupJSON(); },
  bksave:saveFile,
  bkrestore:function(){ var txt=$('#bk').value.trim(); if(!txt){ flashMsg('Поле пустое.'); return; } restoreText(txt); },
  reset:function(){
    if(confirmKey!=='reset'){ confirmKey='reset'; renderSettings($('#view')); return; }
    confirmKey=null; S.cards={}; S.seq=0; S.log=[]; S.daily={day:-1,newDone:0,extra:0}; S.buried={}; cur=null; undoRec=null;
    ensureCards(); persist(); renderSettings($('#view')); flashMsg('Прогресс сброшен.');
  }
};
function init(){
  var o=loadJSON(KEY); S=(o&&o.v===2)?o:newState(); migrate();
  var cc=loadJSON(CKEY); if(cc&&cc.packs) C=cc;
  applyContent();
  var view=$('#view');
  view.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]'); if(!t) return;
    var h=handlers[t.dataset.act]; if(h) h(t,e);
  });
  view.addEventListener('focusin',function(e){ if(e.target.classList&&e.target.classList.contains('blank-input')) lastBlank=e.target; });
  view.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='impfile'){ readFile(t,importText); return; }
    if(t.id==='bkfile'){ readFile(t,restoreText); return; }
    if(t.dataset&&t.dataset.pack){
      var pid=t.dataset.pack;
      if(t.checked) delete S.packs[pid]; else S.packs[pid]={off:true};
      applyContent(); cur=null; persist(); renderDeck($('#view')); return;
    }
    var k=t.dataset&&t.dataset.set; if(!k) return;
    var c=S.cfg, ok=true;
    var nums=function(s){return s.split(/[\s,;]+/).map(function(x){return parseFloat(x.replace(',','.'));}).filter(function(x){return x>0&&isFinite(x);});};
    var num=function(lo,hi,def){var x=parseFloat(String(t.value).replace(',','.')); return isFinite(x)?Math.min(hi,Math.max(lo,x)):def;};
    if(k==='newPerDay') c.newPerDay=Math.round(num(0,200,c.newPerDay));
    else if(k==='steps'){ var a=nums(t.value); if(a.length) c.steps=a; else ok=false; }
    else if(k==='relearnSteps'){ var b=nums(t.value); if(b.length) c.relearnSteps=b; else ok=false; }
    else if(k==='gradIvl') c.gradIvl=Math.round(num(1,30,c.gradIvl));
    else if(k==='easyIvl') c.easyIvl=Math.round(num(2,60,c.easyIvl));
    else if(k==='ivlMod') c.ivlMod=num(0.4,2,c.ivlMod);
    else if(k==='maxIvl') c.maxIvl=Math.round(num(7,3650,c.maxIvl));
    else if(k==='mode') c.mode=(t.value==='self'?'self':'type');
    else if(k==='lenient') c.lenient=!!t.checked;
    if(c.easyIvl<=c.gradIvl) c.easyIvl=c.gradIvl+1;
    persist(); cur=null;
    renderSettings($('#view')); flashMsg(ok?'Сохранено.':'Не понял значение: оставил прежнее.');
  });
  document.querySelector('.tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(!b) return;
    tab=b.dataset.tab; confirmKey=null; render();
  });
  document.addEventListener('keydown',function(e){
    if(tab!=='study'||!cur||e.repeat||e.ctrlKey||e.metaKey||e.altKey) return;
    var t=e.target;
    if(t.classList&&t.classList.contains('blank-input')){
      if(e.key==='Enter'){
        e.preventDefault();
        var ins=[].slice.call(view.querySelectorAll('.blank-input')), i=ins.indexOf(t);
        if(i>=0&&i<ins.length-1) ins[i+1].focus(); else doCheck(false);
      }
      return;
    }
    if(t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.tagName==='INPUT') return;
    if(cur.phase==='answer'){
      if(['1','2','3','4'].indexOf(e.key)>=0) grade(+e.key);
      else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); grade(cur.sug||3); }
    } else if(S.cfg.mode==='self'&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); reveal(); }
  });
  /* приложение на телефоне обычно не закрывают, а сворачивают: при возврате проверяем колоду */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    if(Date.now()-(C.checked||0)>10*MIN) refreshPacks(false);
    if(tab==='study'&&!cur) render();
  });
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(tab==='study'&&(!cur||cur.phase==='answer')||tab==='settings') render(); });
  window.addEventListener('appinstalled',function(){ installEvt=null; render(); });
  render();
  refreshPacks(false);
  if('serviceWorker' in navigator&&location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(function(){});
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
